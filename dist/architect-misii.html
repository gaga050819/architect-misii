        return "\u041F\u043E\u0447\u0430\u043B\u0430\u0441\u044F \u043F\u0438\u043B\u043E\u0432\u0430 \u0431\u0443\u0440\u044F.";
      case "storm_end":
        return "\u0411\u0443\u0440\u044F \u0432\u0449\u0443\u0445\u043B\u0430.";
      case "choice":
        return `\u0420\u0456\u0448\u0435\u043D\u043D\u044F: ${optionLabel(p.decision, p.option, m)}.`;
      case "event":
        return tr(p.event.title) + ".";
      case "lost":
        return `\u041C\u0456\u0441\u0456\u044E \u0432\u0442\u0440\u0430\u0447\u0435\u043D\u043E: ${CAUSE_SHORT[p.cause] || p.cause}.`;
      case "instrument_fail":
        return `\u0412\u0456\u0434\u043C\u043E\u0432\u0438\u0432 \u043F\u0440\u0438\u043B\u0430\u0434: ${tr(p.instr.name)}.`;
      case "backup_antenna":
        return "\u0413\u043E\u043B\u043E\u0432\u043D\u0430 \u0430\u043D\u0442\u0435\u043D\u0430 \u0432\u0456\u0434\u043C\u043E\u0432\u0438\u043B\u0430, \u043F\u0440\u0430\u0446\u044E\u0454 \u0440\u0435\u0437\u0435\u0440\u0432\u043D\u0430.";
      case "antenna_fallback":
        return "\u0413\u043E\u043B\u043E\u0432\u043D\u0430 \u0430\u043D\u0442\u0435\u043D\u0430 \u0432\u0456\u0434\u043C\u043E\u0432\u0438\u043B\u0430. \u0417\u0432\u2019\u044F\u0437\u043E\u043A \u043B\u0438\u0448\u0435 \u0447\u0435\u0440\u0435\u0437 \u043C\u0430\u043B\u0443 \u0430\u043D\u0442\u0435\u043D\u0443 \u2014 \u0434\u0443\u0436\u0435 \u043F\u043E\u0432\u0456\u043B\u044C\u043D\u043E.";
      case "safe_mode":
        return `\u0411\u0435\u0437\u043F\u0435\u0447\u043D\u0438\u0439 \u0440\u0435\u0436\u0438\u043C: \u0432\u0438\u0440\u043E\u0431\u043B\u0435\u043D\u043E ${fmt2(p.produced)}\xA0\u0412\u0442, \u0430 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0456 \u043F\u043E\u0442\u0440\u0456\u0431\u043D\u043E ${fmt2(p.bus)}\xA0\u0412\u0442.`;
      case "night":
        return "\u041C\u0456\u0441\u044F\u0447\u043D\u0430 \u043D\u0456\u0447: \u0430\u043F\u0430\u0440\u0430\u0442 \u0432\u0438\u043C\u043A\u043D\u0435\u043D\u043E \u0434\u043E \u0441\u0432\u0456\u0442\u0430\u043D\u043A\u0443.";
      case "night_survived":
        return "\u0410\u043F\u0430\u0440\u0430\u0442 \u043F\u0435\u0440\u0435\u0436\u0438\u0432 \u043D\u0456\u0447.";
      case "sleep":
        return "\u0421\u043F\u043B\u044F\u0447\u0438\u0439 \u0440\u0435\u0436\u0438\u043C: \u0447\u0435\u043A\u0430\u0454\u043C\u043E \u043A\u0456\u043D\u0446\u044F \u0431\u0443\u0440\u0456.";
      case "reset":
        return "\u041A\u043E\u043C\u043F\u2019\u044E\u0442\u0435\u0440 \u043F\u0435\u0440\u0435\u0437\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0443\u0432\u0430\u0432\u0441\u044F \u0432\u0435\u0441\u044C \u043A\u0440\u043E\u043A.";
      case "extended":
        return `NASA \u043F\u0440\u043E\u0434\u043E\u0432\u0436\u0438\u043B\u043E \u043C\u0456\u0441\u0456\u044E \u0449\u0435 \u043D\u0430 ${p.steps}\xA0${plural(p.steps, ["\u043A\u0440\u043E\u043A", "\u043A\u0440\u043E\u043A\u0438", "\u043A\u0440\u043E\u043A\u0456\u0432"])}!`;
      case "complete":
        return "\u041E\u0441\u043D\u043E\u0432\u043D\u0443 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u0443 \u043C\u0456\u0441\u0456\u0457 \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043D\u043E.";
      case "units_ok":
        return "\u041E\u0434\u0438\u043D\u0438\u0446\u0456 \u043F\u0435\u0440\u0435\u0432\u0456\u0440\u0435\u043D\u043E \u0439 \u043F\u0435\u0440\u0435\u0440\u0430\u0445\u043E\u0432\u0430\u043D\u043E. \u041A\u0443\u0440\u0441 \u0442\u043E\u0447\u043D\u0438\u0439.";
      case "units_bad":
        return "\u041F\u043E\u043F\u0440\u0430\u0432\u043A\u0443 \u0437\u0430\u0441\u0442\u043E\u0441\u043E\u0432\u0430\u043D\u043E \u0437 \u043F\u043E\u043C\u0438\u043B\u043A\u043E\u044E \u0432 \u043E\u0434\u0438\u043D\u0438\u0446\u044F\u0445. \u0410\u043F\u0430\u0440\u0430\u0442 \u0456\u0434\u0435 \u043D\u0435 \u0442\u0438\u043C \u043A\u0443\u0440\u0441\u043E\u043C!";
      case "tipped":
        return `\u041D\u0435\u0434\u043E\u0441\u0442\u0443\u043F\u043D\u0456 \u043F\u0440\u0438\u043B\u0430\u0434\u0438: ${p.names.map((x) => tr(x.name)).join(", ")}.`;
      case "wheel_backwards":
        return "\u0420\u043E\u0432\u0435\u0440 \u0457\u0437\u0434\u0438\u0442\u044C \u0437\u0430\u0434\u043E\u043C \u043D\u0430\u043F\u0435\u0440\u0435\u0434: \u043F\u043E\u0432\u0456\u043B\u044C\u043D\u0456\u0448\u0435, \u0437\u0430\u0442\u0435 \u0431\u0435\u0437\u043F\u0435\u0447\u043D\u043E.";
      case "wheel_lucky":
        return "\u041F\u043E\u0449\u0430\u0441\u0442\u0438\u043B\u043E: \u043D\u043E\u0432\u0438\u0439 \u043C\u0430\u0440\u0448\u0440\u0443\u0442 \u0432\u0438\u044F\u0432\u0438\u0432\u0441\u044F \u0431\u0435\u0437\u043F\u0435\u0447\u043D\u0438\u043C.";
      case "wheel_stuck":
        return "\u0420\u043E\u0432\u0435\u0440 \u0437\u0430\u0441\u0442\u0440\u044F\u0433 \u043D\u0430 \u0441\u043A\u043B\u0430\u0434\u043D\u043E\u043C\u0443 \u043C\u0430\u0440\u0448\u0440\u0443\u0442\u0456 \u0456 \u043C\u0430\u0439\u0436\u0435 \u043D\u0435 \u0440\u0443\u0445\u0430\u0454\u0442\u044C\u0441\u044F.";
      case "heat_end":
        return "\u0421\u043F\u0435\u043A\u0430 \u0456 \u0442\u0438\u0441\u043A \u043F\u0435\u0440\u0435\u043C\u043E\u0433\u043B\u0438: \u0430\u043F\u0430\u0440\u0430\u0442 \u0437\u0430\u043C\u043E\u0432\u043A. \u0410\u043B\u0435 \u0432\u0441\u0456 \u0434\u0430\u043D\u0456 \u0432\u0436\u0435 \u043D\u0430 \u0417\u0435\u043C\u043B\u0456.";
      case "touch":
        return `\u0417\u043E\u043D\u0434 \u0442\u043E\u0440\u043A\u0430\u0454\u0442\u044C\u0441\u044F \u043F\u043E\u0432\u0435\u0440\u0445\u043D\u0456 \u0432 \u0440\u0430\u0439\u043E\u043D\u0456 \xAB${tr(p.site.name)}\xBB. \u0420\u0438\u0437\u0438\u043A: ${pct2(p.p)}%.`;
      case "touch_ok":
        return `\u0417\u0440\u0430\u0437\u043E\u043A \u0443\u0437\u044F\u0442\u043E! \u041A\u0430\u043F\u0441\u0443\u043B\u0430 \u0437 \u043D\u0438\u043C \u043F\u043E\u043B\u0435\u0442\u0438\u0442\u044C \u043D\u0430 \u0417\u0435\u043C\u043B\u044E (+${fmt2(p.bonus)} \u043D\u0430\u0443\u043A\u0438).`;
      case "touch_fail":
        return "\u041D\u0435\u0432\u0434\u0430\u043B\u0435 \u0442\u043E\u0440\u043A\u0430\u043D\u043D\u044F: \u043C\u0430\u043D\u0456\u043F\u0443\u043B\u044F\u0442\u043E\u0440 \u043F\u043E\u0448\u043A\u043E\u0434\u0436\u0435\u043D\u043E, \u0437\u0440\u0430\u0437\u043A\u0430 \u043D\u0435\u043C\u0430\u0454.";
      case "sample_skip":
        return "\u0412\u0438\u0440\u0456\u0448\u0438\u043B\u0438 \u043D\u0435 \u0440\u0438\u0437\u0438\u043A\u0443\u0432\u0430\u0442\u0438 \u0456 \u043D\u0435 \u0431\u0440\u0430\u0442\u0438 \u0437\u0440\u0430\u0437\u043E\u043A.";
      case "step":
        return `\u041D\u0430\u0443\u043A\u0438 +${fmt2(p.sci, 1)}. \u041F\u0440\u0438\u043B\u0430\u0434\u0438 \u043F\u0440\u0430\u0446\u044E\u0432\u0430\u043B\u0438 ${pct2(p.u)}% \u0447\u0430\u0441\u0443, \u043F\u0435\u0440\u0435\u0434\u0430\u043D\u043E ${pct2(Math.min(1, p.sent))}% \u0434\u0430\u043D\u0438\u0445.`;
      case "fact": {
        const f = m.data.events.facts[p.id];
        return f ? tr(f) : "";
      }
      default:
        return e.code;
    }
  }
  function factSource(e, m) {
    if (e.code === "fact") return m.data.events.facts[e.params.id]?.source;
    if (e.code === "event") return e.params.event.source;
    return null;
  }
  function eventFact(e) {
    return e.code === "event" && e.params.event.fact ? tr(e.params.event.fact) : null;
  }
  function decisionText(d, m) {
    const t2 = m.r.target;
    switch (d.id) {
      case "site":
        return {
          title: "\u041E\u0431\u0435\u0440\u0456\u0442\u044C \u043C\u0456\u0441\u0446\u0435 \u043F\u043E\u0441\u0430\u0434\u043A\u0438",
          text: "\u0426\u0456\u043A\u0430\u0432\u0456\u0448\u0456 \u043C\u0456\u0441\u0446\u044F \u043D\u0435\u0431\u0435\u0437\u043F\u0435\u0447\u043D\u0456\u0448\u0456: \u043A\u0430\u043C\u0456\u043D\u043D\u044F, \u0441\u0445\u0438\u043B\u0438, \u043A\u0440\u0430\u0442\u0435\u0440\u0438. \u0420\u0438\u0437\u0438\u043A \u043F\u043E\u0441\u0430\u0434\u043A\u0438 \u043C\u043D\u043E\u0436\u0438\u0442\u044C\u0441\u044F \u043D\u0430 \u0448\u0442\u0440\u0430\u0444 \u0437\u0430 \u043C\u0430\u043B\u0438\u0439 \u0437\u0430\u043F\u0430\u0441 \u043C\u0430\u0441\u0438."
        };
      case "storm":
        return {
          title: "\u041F\u0438\u043B\u043E\u0432\u0430 \u0431\u0443\u0440\u044F!",
          text: "\u041F\u0438\u043B \u0437\u0430\u043A\u0440\u0438\u0432 \u0421\u043E\u043D\u0446\u0435: \u043F\u0430\u043D\u0435\u043B\u0456 \u0434\u0430\u044E\u0442\u044C \u043B\u0438\u0448\u0435 40% \u043F\u043E\u0442\u0443\u0436\u043D\u043E\u0441\u0442\u0456, \u0456 \u0442\u0430\u043A \u0431\u0443\u0434\u0435 \u0449\u0435 \u0434\u0432\u0430 \u043A\u0440\u043E\u043A\u0438."
        };
      case "conjunction":
        return {
          title: `\u0421\u043E\u043D\u0446\u0435 \u043C\u0456\u0436 \u0417\u0435\u043C\u043B\u0435\u044E \u0456 \u0446\u0456\u043B\u043B\u044E \xAB${tr(t2.name)}\xBB`,
          text: "\u041D\u0430\u0439\u0431\u043B\u0438\u0436\u0447\u0456 ~2 \u0442\u0438\u0436\u043D\u0456 \u0441\u0438\u0433\u043D\u0430\u043B \u043D\u0435 \u043F\u0440\u043E\u0439\u0434\u0435 \u043A\u0440\u0456\u0437\u044C \u0441\u043E\u043D\u044F\u0447\u043D\u0443 \u043A\u043E\u0440\u043E\u043D\u0443. \u041D\u043E\u0432\u0456 \u043A\u043E\u043C\u0430\u043D\u0434\u0438 \u043D\u0430\u0434\u0456\u0441\u043B\u0430\u0442\u0438 \u043D\u0435 \u0432\u0438\u0439\u0434\u0435."
        };
      case "priority":
        return {
          title: "\u041A\u0430\u043D\u0430\u043B \u0437\u0432\u2019\u044F\u0437\u043A\u0443 \u043F\u0435\u0440\u0435\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u0438\u0439",
          text: `\u0410\u043D\u0442\u0435\u043D\u0430 \u0432\u0441\u0442\u0438\u0433\u0430\u0454 \u043F\u0435\u0440\u0435\u0434\u0430\u0442\u0438 \u043B\u0438\u0448\u0435 ~${pct2(d.params.share)}% \u0434\u0430\u043D\u0438\u0445, \u044F\u043A\u0456 \u0437\u0431\u0438\u0440\u0430\u044E\u0442\u044C \u043F\u0440\u0438\u043B\u0430\u0434\u0438. \u0420\u0435\u0448\u0442\u0443 \u0431\u0443\u0434\u0435 \u043F\u0435\u0440\u0435\u0437\u0430\u043F\u0438\u0441\u0430\u043D\u043E \u0432 \u043F\u0430\u043C\u2019\u044F\u0442\u0456. \u0429\u043E \u043F\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u0438 \u043F\u0435\u0440\u0448\u0438\u043C?`
        };
      case "units":
        return {
          title: "\u041F\u0435\u0440\u0435\u0432\u0456\u0440\u0442\u0435 \u043F\u043E\u043F\u0440\u0430\u0432\u043A\u0443 \u043A\u0443\u0440\u0441\u0443",
          text: "\u041F\u0440\u043E\u0433\u0440\u0430\u043C\u0430 \u0432\u0438\u0440\u043E\u0431\u043D\u0438\u043A\u0430 \u0432\u0438\u0434\u0430\u043B\u0430 \u0456\u043C\u043F\u0443\u043B\u044C\u0441 \u0434\u0432\u0438\u0433\u0443\u043D\u0456\u0432: 1 \u0444\u0443\u043D\u0442-\u0441\u0438\u043B\u0430-\u0441\u0435\u043A\u0443\u043D\u0434\u0430. \u041D\u0430\u0432\u0456\u0433\u0430\u0446\u0456\u044F \u0430\u043F\u0430\u0440\u0430\u0442\u0430 \u043F\u0440\u0438\u0439\u043C\u0430\u0454 \u043B\u0438\u0448\u0435 \u043D\u044C\u044E\u0442\u043E\u043D-\u0441\u0435\u043A\u0443\u043D\u0434\u0438. \u0421\u043A\u0456\u043B\u044C\u043A\u0438 \u043D\u044C\u044E\u0442\u043E\u043D-\u0441\u0435\u043A\u0443\u043D\u0434 \u0432\u0432\u043E\u0434\u0438\u043C\u043E?"
        };
      case "wheel":
        return {
          title: "\u0417\u0430\u043A\u043B\u0438\u043D\u0438\u043B\u043E \u043A\u043E\u043B\u0435\u0441\u043E",
          text: "\u041E\u0434\u043D\u0435 \u0437 \u0448\u0435\u0441\u0442\u0438 \u043A\u043E\u043B\u0456\u0441 \u0431\u0456\u043B\u044C\u0448\u0435 \u043D\u0435 \u043E\u0431\u0435\u0440\u0442\u0430\u0454\u0442\u044C\u0441\u044F. \u041F\u043E\u043F\u0435\u0440\u0435\u0434\u0443 \u0446\u0456\u043A\u0430\u0432\u0456 \u043F\u043E\u0440\u043E\u0434\u0438, \u0430\u043B\u0435 \u0448\u043B\u044F\u0445 \u043A\u0430\u043C\u2019\u044F\u043D\u0438\u0441\u0442\u0438\u0439."
        };
      case "sample":
        return {
          title: "\u0427\u0430\u0441 \u0431\u0440\u0430\u0442\u0438 \u0437\u0440\u0430\u0437\u043E\u043A",
          text: "\u0417\u043E\u043D\u0434 \u0442\u043E\u0440\u043A\u043D\u0435\u0442\u044C\u0441\u044F \u043F\u043E\u0432\u0435\u0440\u0445\u043D\u0456 \u043D\u0430 \u043A\u0456\u043B\u044C\u043A\u0430 \u0441\u0435\u043A\u0443\u043D\u0434 \u0456 \u0432\u0434\u0438\u0445\u043D\u0435 \u043F\u0438\u043B \u0441\u0442\u0440\u0443\u043C\u0435\u043D\u0435\u043C \u0430\u0437\u043E\u0442\u0443. \u0426\u0456\u043A\u0430\u0432\u0456\u0448\u0456 \u043C\u0456\u0441\u0446\u044F \u0440\u0438\u0437\u0438\u043A\u043E\u0432\u0430\u043D\u0456\u0448\u0456: \u043D\u0430\u0432\u043A\u043E\u043B\u043E \u0431\u0440\u0438\u043B\u0438 \u0440\u043E\u0437\u043C\u0456\u0440\u043E\u043C \u0437 \u0431\u0443\u0434\u0438\u043D\u043E\u043A."
        };
      default:
        return { title: d.id, text: "" };
    }
  }
  function optionInfo(decisionId, option, m) {
    const battery = m.r.extras.some((e) => e.effect === "big_battery");
    const id = typeof option === "string" ? option : option.id;
    switch (decisionId) {
      case "site": {
        const site = m.r.target.sites.find((x) => x.id === id);
        const solar = m.r.power.type === "solar" ? ` \u0421\u043E\u043D\u0446\u0435 ${pct2(siteSolarMult(site))}% \u0432\u0456\u0434 \u0435\u043A\u0432\u0430\u0442\u043E\u0440\u0456\u0430\u043B\u044C\u043D\u043E\u0433\u043E.` : "";
        return { label: tr(site.name), hint: `\u0420\u0438\u0437\u0438\u043A ${pct2(site.risk * m.penalty * (0.7 + 0.3 * m.relMult))}%, \u043D\u0430\u0443\u043A\u0430 \xD7${fmt2(site.science_mult, 1)}.${solar} ${tr(site.note)}` };
      }
      case "storm":
        return id === "sleep" ? { label: "\u0421\u043F\u043B\u044F\u0447\u0438\u0439 \u0440\u0435\u0436\u0438\u043C", hint: "\u0411\u0435\u0437\u043F\u0435\u0447\u043D\u043E, \u0430\u043B\u0435 \u0431\u0435\u0437 \u043D\u0430\u0443\u043A\u0438, \u043F\u043E\u043A\u0438 \u0442\u0440\u0438\u0432\u0430\u0454 \u0431\u0443\u0440\u044F." } : { label: "\u041F\u0440\u0430\u0446\u044E\u0432\u0430\u0442\u0438 \u0434\u0430\u043B\u0456", hint: `\u041D\u0430\u0443\u043A\u0430 \u0454, \u0430\u043B\u0435 ${battery ? "5" : "20"}% \u0448\u0430\u043D\u0441 \u0437\u0430 \u043A\u0440\u043E\u043A \u0440\u043E\u0437\u0440\u044F\u0434\u0438\u0442\u0438 \u0430\u043A\u0443\u043C\u0443\u043B\u044F\u0442\u043E\u0440 \u0456 \u0432\u0442\u0440\u0430\u0442\u0438\u0442\u0438 \u0430\u043F\u0430\u0440\u0430\u0442.` };
      case "conjunction":
        return id === "upload" ? { label: "\u0417\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0438\u0442\u0438 \u043F\u043B\u0430\u043D \u0437\u0430\u0437\u0434\u0430\u043B\u0435\u0433\u0456\u0434\u044C", hint: "\u0410\u043F\u0430\u0440\u0430\u0442 \u043F\u0440\u0430\u0446\u044E\u0454 \u0441\u0430\u043C; \u0432\u0442\u0440\u0430\u0447\u0430\u0454\u0442\u044C\u0441\u044F \u043B\u0438\u0448\u0435 \u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0430 \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0456 \u0434\u0430\u043D\u0438\u0445." } : { label: "\u0427\u0435\u043A\u0430\u0442\u0438", hint: "\u041F\u0440\u043E\u0441\u0442\u0456\u0448\u0435, \u0430\u043B\u0435 \u0430\u043F\u0430\u0440\u0430\u0442 \u043F\u0440\u043E\u0441\u0442\u043E\u044E\u0454 \u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0443 \u043A\u0440\u043E\u043A\u0443." };
      case "units":
        return {
          "4.45": { label: "4,45 \u041D\xB7\u0441", hint: "1 \u0444\u0443\u043D\u0442-\u0441\u0438\u043B\u0430 \u2248 4,45 \u043D\u044C\u044E\u0442\u043E\u043D\u0430." },
          "0.45": { label: "0,45 \u041D\xB7\u0441", hint: "\u0424\u0443\u043D\u0442 \u043C\u0430\u0441\u0438 \u2248 0,45 \u043A\u0456\u043B\u043E\u0433\u0440\u0430\u043C\u0430." },
          1: { label: "1 \u041D\xB7\u0441", hint: "\u0417\u0430\u043B\u0438\u0448\u0438\u0442\u0438 \u0447\u0438\u0441\u043B\u043E \u044F\u043A \u0454." }
        }[id];
      case "wheel":
        return id === "backwards" ? { label: "\u0407\u0445\u0430\u0442\u0438 \u0437\u0430\u0434\u043E\u043C \u043D\u0430\u043F\u0435\u0440\u0435\u0434", hint: "\u042F\u043A Spirit: \u043F\u043E\u0432\u0456\u043B\u044C\u043D\u0456\u0448\u0435, \u0430\u043B\u0435 \u0431\u0435\u0437\u043F\u0435\u0447\u043D\u043E. \u0420\u0443\u0445\u043B\u0438\u0432\u0456\u0441\u0442\u044C \u221230%." } : { label: "\u0420\u0438\u0437\u0438\u043A\u043D\u0443\u0442\u0438 \u043C\u0430\u0440\u0448\u0440\u0443\u0442\u043E\u043C", hint: "50 \u043D\u0430 50: \u0430\u0431\u043E \u043C\u0430\u0439\u0436\u0435 \u0431\u0435\u0437 \u0432\u0442\u0440\u0430\u0442, \u0430\u0431\u043E \u0440\u043E\u0432\u0435\u0440 \u0437\u0430\u0441\u0442\u0440\u044F\u0433\u043D\u0435." };
      case "sample": {
        if (id === "skip") return { label: "\u041D\u0435 \u0431\u0440\u0430\u0442\u0438 \u0437\u0440\u0430\u0437\u043E\u043A", hint: "\u0411\u0435\u0437\u043F\u0435\u0447\u043D\u043E, \u0430\u043B\u0435 \u0433\u043E\u043B\u043E\u0432\u043D\u0430 \u043D\u0430\u0443\u043A\u0430 \u043C\u0456\u0441\u0456\u0457 \u0437\u0430\u043B\u0438\u0448\u0438\u0442\u044C\u0441\u044F \u043D\u0430 \u0430\u0441\u0442\u0435\u0440\u043E\u0457\u0434\u0456." };
        const site = m.r.target.sites.find((x) => x.id === id);
        return { label: tr(site.name), hint: `\u0420\u0438\u0437\u0438\u043A ${pct2(site.risk * m.penalty)}%, \u0446\u0456\u043D\u043D\u0456\u0441\u0442\u044C \u0437\u0440\u0430\u0437\u043A\u0430 \xD7${fmt2(site.science_mult, 1)}. ${tr(site.note)}` };
      }
      case "priority":
        return id === "science" ? { label: "\u0421\u043F\u0435\u0440\u0448\u0443 \u043D\u0430\u0439\u0446\u0456\u043D\u043D\u0456\u0448\u0435", hint: "\u0414\u0430\u043D\u0456 \u0437 \u043D\u0430\u0439\u0431\u0456\u043B\u044C\u0448\u043E\u044E \u043D\u0430\u0443\u043A\u043E\u044E \u043D\u0430 \u043C\u0435\u0433\u0430\u0431\u0456\u0442 \u0456\u0434\u0443\u0442\u044C \u043F\u0435\u0440\u0448\u0438\u043C\u0438. \u0412\u0435\u043B\u0438\u043A\u0456 \u0437\u043D\u0456\u043C\u043A\u0438 \u043C\u043E\u0436\u0443\u0442\u044C \u043D\u0435 \u043F\u043E\u0442\u0440\u0430\u043F\u0438\u0442\u0438 \u043D\u0430 \u0417\u0435\u043C\u043B\u044E." } : { label: "\u041F\u043E\u0440\u0456\u0432\u043D\u0443", hint: "\u041A\u043E\u0436\u0435\u043D \u043F\u0440\u0438\u043B\u0430\u0434 \u043F\u0435\u0440\u0435\u0434\u0430\u0454 \u043E\u0434\u043D\u0430\u043A\u043E\u0432\u0443 \u0447\u0430\u0441\u0442\u043A\u0443 \u0441\u0432\u043E\u0457\u0445 \u0434\u0430\u043D\u0438\u0445." };
      default:
        return { label: id, hint: "" };
    }
  }
  function optionLabel(decisionId, optionId, m) {
    return optionInfo(decisionId, optionId, m).label;
  }

  // js/ui/flight.js
  function render4(root, app2) {
    if (!app2.dev || !app2.dev.done || app2.dev.cancelled) {
      app2.go("dev");
      return;
    }
    if (!app2.mission) app2.mission = new Mission(app2.data, app2.dev.build, app2.seed, app2.dev);
    const m = app2.mission;
    const started = m.entries.length > 0;
    const last = m.timeline[m.timeline.length - 1];
    root.innerHTML = `
    <div class="flight">
      <div>
        <h1>${started ? "\u0426\u0435\u043D\u0442\u0440 \u043A\u0435\u0440\u0443\u0432\u0430\u043D\u043D\u044F" : "\u0413\u043E\u0442\u043E\u0432\u043D\u0456\u0441\u0442\u044C \u0434\u043E \u0441\u0442\u0430\u0440\u0442\u0443"}</h1>
        <p class="muted">${t(m.r.target.name)} \xB7 ${t(m.r.platform.name)} \xB7 ${t(m.r.rocket.name)} \xB7 \u043A\u043E\u0434 ${esc(app2.seed)}</p>
        ${m.pending ? decisionPanel2(m) : controls2(m, started)}
        ${telemetry(m, last)}
      </div>
      <div>
        <section class="panel" aria-live="polite">
          <h2>\u0416\u0443\u0440\u043D\u0430\u043B \u043C\u0456\u0441\u0456\u0457</h2>
          ${started ? `<ol class="log" reversed>${[...m.entries].reverse().map((e) => logItem2(e, m)).join("")}</ol>` : '<p class="muted">\u0416\u0443\u0440\u043D\u0430\u043B \u043F\u043E\u0447\u043D\u0435\u0442\u044C\u0441\u044F \u043F\u0456\u0441\u043B\u044F \u0441\u0442\u0430\u0440\u0442\u0443.</p>'}
        </section>
      </div>
    </div>`;
    root.querySelector('[data-act="step"]')?.addEventListener("click", (e) => {
      if (!started) {
        e.currentTarget.disabled = true;
        countdown(() => {
          m.advance();
          after(m, app2);
        }, sfx, rocketSvg(m.r.rocket, { flame: true, className: "rocket" }));
        return;
      }
      m.advance();
      after(m, app2);
    });
    root.querySelector('[data-act="run"]')?.addEventListener("click", () => {
      let guard = 0;
      while (!m.done && !m.pending && guard++ < 200) m.advance();
      after(m, app2);
    });
    root.querySelector('[data-act="summary"]')?.addEventListener("click", () => app2.go("summary"));
    root.querySelector('[data-act="rebuild"]')?.addEventListener("click", () => {
      app2.mission = null;
      app2.dev = null;
      app2.go("builder");
    });
    root.querySelectorAll("[data-option]").forEach((b) => b.addEventListener("click", () => {
      m.choose(b.dataset.option);
      m.advance();
      after(m, app2);
    }));
  }
  function after(m, app2) {
    if (m.pending) sfx.decision();
    else if (m.done) (m.s.lost ? sfx.bad : sfx.good)();
    app2.render();
  }
  function controls2(m, started) {
    if (m.done) {
      return `<section class="panel">
      <h2>${m.s.lost ? "\u0417\u0432\u2019\u044F\u0437\u043E\u043A \u0437 \u0430\u043F\u0430\u0440\u0430\u0442\u043E\u043C \u0432\u0442\u0440\u0430\u0447\u0435\u043D\u043E" : "\u041C\u0456\u0441\u0456\u044E \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043D\u043E"}</h2>
      <div class="btn-row"><button type="button" class="btn" data-act="summary">\u041F\u043E\u0434\u0438\u0432\u0438\u0442\u0438\u0441\u044F \u043F\u0456\u0434\u0441\u0443\u043C\u043E\u043A</button></div>
    </section>`;
    }
    if (!started) {
      return `<section class="panel">
      <p>\u0423\u0441\u0456 \u0441\u0438\u0441\u0442\u0435\u043C\u0438 \u0432 \u043D\u043E\u0440\u043C\u0456. \u041F\u0456\u0441\u043B\u044F \u0441\u0442\u0430\u0440\u0442\u0443 \u0437\u0443\u043F\u0438\u043D\u0438\u0442\u0438 \u043C\u0456\u0441\u0456\u044E \u0432\u0436\u0435 \u043D\u0435 \u0432\u0438\u0439\u0434\u0435.</p>
      <div class="btn-row">
        <button type="button" class="btn launch" data-act="step">\u0421\u0442\u0430\u0440\u0442</button>
        <button type="button" class="btn secondary" data-act="rebuild">\u041F\u043E\u0432\u0435\u0440\u043D\u0443\u0442\u0438\u0441\u044F \u0434\u043E \u043A\u043E\u043D\u0441\u0442\u0440\u0443\u043A\u0442\u043E\u0440\u0430</button>
      </div>
    </section>`;
    }
    const phaseName = { cruise: "\u041F\u0435\u0440\u0435\u043B\u0456\u0442", arrival: "\u041F\u0440\u0438\u0431\u0443\u0442\u0442\u044F", ops: "\u041D\u0430\u0443\u043A\u043E\u0432\u0430 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u0430", end: "\u0417\u0430\u0432\u0435\u0440\u0448\u0435\u043D\u043D\u044F" }[m.s.phase] || "";
    return `<section class="panel">
    <h2>${phaseName}</h2>
    <div class="btn-row" style="margin-top:0">
      <button type="button" class="btn" data-act="step">\u041D\u0430\u0441\u0442\u0443\u043F\u043D\u0438\u0439 \u043A\u0440\u043E\u043A</button>
      <button type="button" class="btn secondary" data-act="run">\u041B\u0435\u0442\u0456\u0442\u0438 \u0434\u043E \u043D\u0430\u0441\u0442\u0443\u043F\u043D\u043E\u0433\u043E \u0440\u0456\u0448\u0435\u043D\u043D\u044F</button>
    </div>
  </section>`;
  }
  function decisionPanel2(m) {
    const d = m.pending;
    const info = decisionText(d, m);
    const map = d.id === "site" ? siteMap(m) : "";
    return `<section class="panel decision" role="dialog" aria-labelledby="dec-title">
    <h2 id="dec-title">${esc(info.title)}</h2>
    <p>${esc(info.text)}</p>
    ${map}
    <div class="options">
      ${d.options.map((o) => {
      const oi = optionInfo(d.id, o, m);
      return `
        <button type="button" class="choice" data-option="${esc(o.id)}">
          <span class="choice-name">${esc(oi.label)}</span>
          <span class="choice-desc">${esc(oi.hint)}</span>
        </button>`;
    }).join("")}
    </div>
  </section>`;
  }
  function siteMap(m) {
    const sites = m.r.target.sites;
    const map = (m.data.media.maps || []).find((x) => x.target === m.r.target.id);
    const isMars = m.r.target.id === "mars";
    const W = 400;
    const H = 200;
    const X = (lon) => (lon + 180) / 360 * W;
    const Y = (lat) => (90 - lat) / 180 * H;
    const grid = [];
    for (let lon = -120; lon <= 120; lon += 60) grid.push(`<line x1="${X(lon)}" x2="${X(lon)}" y1="0" y2="${H}"/>`);
    for (let lat = -60; lat <= 60; lat += 30) grid.push(`<line x1="0" x2="${W}" y1="${Y(lat)}" y2="${Y(lat)}"/>`);
    return `<svg class="sitemap" viewBox="0 0 ${W} ${H}" role="img" aria-label="\u0421\u0445\u0435\u043C\u0430 \u043C\u0430\u0439\u0434\u0430\u043D\u0447\u0438\u043A\u0456\u0432 \u043F\u043E\u0441\u0430\u0434\u043A\u0438 \u0437\u0430 \u0440\u0435\u0430\u043B\u044C\u043D\u0438\u043C\u0438 \u043A\u043E\u043E\u0440\u0434\u0438\u043D\u0430\u0442\u0430\u043C\u0438">
    <defs><linearGradient id="shade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".3"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient></defs>
    <rect width="${W}" height="${H}" rx="8" fill="${isMars ? "#a65a35" : "#7d838e"}"/>
    ${map ? `<clipPath id="mapclip"><rect width="${W}" height="${H}" rx="8"/></clipPath>
    <image href="${esc(map.file)}" width="${W}" height="${H}" preserveAspectRatio="none" clip-path="url(#mapclip)"/>` : ""}
    <rect width="${W}" height="${H}" rx="8" fill="url(#shade)"/>
    <g stroke="#fff" stroke-opacity=".18" stroke-width="1">${grid.join("")}</g>
    ${sites.map((s) => {
      const x = X(s.lon);
      const y = Math.min(H - 14, Math.max(14, Y(s.lat)));
      const rr = 5 + s.risk * 35;
      const left = x > W * 0.7;
      return `<g><circle cx="${x}" cy="${y}" r="${rr}" fill="#fff" fill-opacity=".2" stroke="#fff" stroke-width="1.5"/>
        <circle cx="${x}" cy="${y}" r="2.5" fill="#fff"/>
        <text x="${left ? x - rr - 5 : x + rr + 5}" y="${y + 4}" fill="#fff" stroke="#000" stroke-opacity=".55" stroke-width="3" paint-order="stroke" font-size="12" text-anchor="${left ? "end" : "start"}" font-family="IBM Plex Sans, sans-serif">${t(s.name)}</text></g>`;
    }).join("")}
  </svg>
  <p class="small muted" style="text-align:center;margin-top:.3rem">\u0420\u0435\u0430\u043B\u044C\u043D\u0456 \u043A\u043E\u043E\u0440\u0434\u0438\u043D\u0430\u0442\u0438, \u0441\u0456\u0442\u043A\u0430 \u0447\u0435\u0440\u0435\u0437 30\xB0 \u0456 60\xB0. \u0420\u043E\u0437\u043C\u0456\u0440 \u043A\u043E\u043B\u0430 \u2014 \u0440\u0438\u0437\u0438\u043A \u043F\u043E\u0441\u0430\u0434\u043A\u0438.${map?.credit ? ` \u041A\u0430\u0440\u0442\u0430: ${esc(map.credit)}.` : ""}</p>`;
  }
  function telemetry(m, last) {
    const s = m.s;
    const total = s.steps;
    const done = m.timeline.length;
    const cells = Array.from({ length: total }, (_, i) => {
      const cls = i < done ? "done" : s.lost && i === done ? "lost" : "";
      return `<span class="${cls} ${i >= opsSteps(m.r) ? "ext" : ""}" title="\u041A\u0440\u043E\u043A ${i + 1}"></span>`;
    }).join("");
    const need = busPower(m.r) + instrumentPower(m.aliveInstruments);
    const target = m.r.cls.science_target;
    return `<section class="panel">
    <h2>\u0422\u0435\u043B\u0435\u043C\u0435\u0442\u0440\u0456\u044F</h2>
    <figure class="orbit-wrap">${orbitSvg(m.r.target, s.phase === "launch" || s.phase === "cruise" ? 0 : done * m.r.target.step_days)}</figure>
    <div class="track" aria-label="\u041A\u0440\u043E\u043A\u0438 \u043D\u0430\u0443\u043A\u043E\u0432\u043E\u0457 \u043F\u0440\u043E\u0433\u0440\u0430\u043C\u0438: ${done} \u0437 ${total}">${cells}</div>
    <dl class="tele">
      <div><dt>\u041D\u0430\u0443\u043A\u0430</dt><dd><span class="science-big num">${fmt(s.science)}</span> <span class="muted small">\u0437 ${fmt(target)}</span></dd></div>
      <div><dt>\u041A\u0440\u043E\u043A</dt><dd>${done} \u0437 ${total} <span class="muted small">(${fmt(m.r.target.step_days)}\xA0${dayWord(m.r.target.step_days)} \u043A\u043E\u0436\u0435\u043D)</span></dd></div>
      <div><dt>\u0415\u043D\u0435\u0440\u0433\u0456\u044F</dt><dd>${last ? `${fmt(last.produced)}\xA0\u0412\u0442 \u0437 \u043F\u043E\u0442\u0440\u0456\u0431\u043D\u0438\u0445 ${fmt(need)}\xA0\u0412\u0442` : "\u2014"}</dd></div>
      <div><dt>\u041F\u0440\u0438\u043B\u0430\u0434\u0438 \u043F\u0440\u0430\u0446\u044E\u044E\u0442\u044C</dt><dd>${last ? pct(last.u) : "\u2014"} \u0447\u0430\u0441\u0443</dd></div>
      <div><dt>\u0414\u0430\u043D\u0456 \u0437\u0430 \u043A\u0440\u043E\u043A</dt><dd>${last && last.collected ? `\u043F\u0435\u0440\u0435\u0434\u0430\u043D\u043E ${pct(last.sent / last.collected)} \u0437 ${fmt(last.collected / 1e3, 1)}\xA0\u0413\u0431\u0456\u0442` : "\u2014"}</dd></div>
      <div><dt>\u0412\u0456\u0434\u0441\u0442\u0430\u043D\u044C \u0434\u043E \u0417\u0435\u043C\u043B\u0456</dt><dd>${last ? `${fmt(last.dist, last.dist < 0.01 ? 4 : 2)}\xA0\u0430.\u043E.` : "\u2014"}</dd></div>
      ${m.r.power.type === "solar" && m.r.target.dust_per_step > 0 && m.r.platform.type !== "orbiter" ? `<div><dt>\u0427\u0438\u0441\u0442\u043E\u0442\u0430 \u043F\u0430\u043D\u0435\u043B\u0435\u0439</dt><dd>${pct(s.dust)}</dd></div>` : ""}
      <div><dt>\u0410\u043D\u0442\u0435\u043D\u0430</dt><dd>${t(s.antenna.name)}</dd></div>
    </dl>
    <div class="chips" aria-label="\u0421\u0442\u0430\u043D \u043F\u0440\u0438\u043B\u0430\u0434\u0456\u0432">
      ${s.instruments.map((i) => `<span class="chip ${i.alive ? "" : "dead"}">${t(i.def.name)}</span>`).join("")}
    </div>

      \u043D\u0430 \u041C\u0430\u0440\u0441\u0456 \u0437\u0430\u0437\u0434\u0430\u043B\u0435\u0433\u0456\u0434\u044C \u0442\u0440\u0435\u0431\u0430 \u0434\u043E\u0431\u0443\u0442\u0438 ~${fmt(c.needs.ascent_o2_t)}\xA0\u0442 \u043A\u0438\u0441\u043D\u044E \u0434\u043B\u044F \u0437\u0432\u043E\u0440\u043E\u0442\u043D\u043E\u0457 \u0440\u0430\u043A\u0435\u0442\u0438. \u0421\u043F\u0440\u043E\u0454\u043A\u0442\u0443\u0439\u0442\u0435 \u043A\u0438\u0441\u043D\u0435\u0432\u0438\u0439 \u0437\u0430\u0432\u043E\u0434,
      \u044F\u043A\u0438\u0439 \u0432\u0441\u0442\u0438\u0433\u043D\u0435 \u0434\u043E \u043F\u0440\u0438\u043B\u044C\u043E\u0442\u0443 \u0435\u043A\u0456\u043F\u0430\u0436\u0443: \u043D\u0430 \u0446\u0435 \u0454 \u043E\u0434\u043D\u0435 \u0432\u0456\u043A\u043D\u043E \u0437\u0430\u043F\u0443\u0441\u043A\u0443, ~${fmt(c.needs.window_days)}\xA0${dayWord(c.needs.window_days)}.</p>
      ${moxie ? `<p class="small">${moxie.alive ? `\u0412\u0430\u0448 MOXIE \u0432\u0456\u0434\u043F\u0440\u0430\u0446\u044E\u0432\u0430\u0432 ${runs}\xA0${plural(runs, ["\u0441\u0435\u0430\u043D\u0441", "\u0441\u0435\u0430\u043D\u0441\u0438", "\u0441\u0435\u0430\u043D\u0441\u0456\u0432"])} \u0456 \u0434\u043E\u0431\u0443\u0432 ~${fmt(runs * c.moxie.o2_g_per_h)} \u0433 \u043A\u0438\u0441\u043D\u044E. \u0422\u0435\u043F\u0435\u0440 \u0439\u043E\u0433\u043E \u0442\u0440\u0435\u0431\u0430 \u0437\u0431\u0456\u043B\u044C\u0448\u0438\u0442\u0438.` : "\u0412\u0430\u0448 MOXIE \u0432\u0456\u0434\u043C\u043E\u0432\u0438\u0432, \u0430\u043B\u0435 \u0434\u0430\u043D\u0456 \u0432\u0441\u0442\u0438\u0433\u043B\u0438 \u0434\u043E\u0432\u0435\u0441\u0442\u0438, \u0449\u043E \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0456\u044F \u043F\u0440\u0430\u0446\u044E\u0454."}</p>` : ""}

      <div class="timeline-bar" role="img" aria-label="\u0427\u0430\u0441 \u0432\u0438\u0440\u043E\u0431\u043D\u0438\u0446\u0442\u0432\u0430 \u043F\u0440\u043E\u0442\u0438 \u0432\u0456\u043A\u043D\u0430 \u0437\u0430\u043F\u0443\u0441\u043A\u0443">
        <span class="tb-fill ${p.ok ? "" : "over"}" style="width:${Math.min(100, shownDays / max * 100)}%"></span>

      <p class="small muted">\u0420\u0438\u0441\u043A\u0430 \u2014 \u043C\u043E\u043C\u0435\u043D\u0442, \u043A\u043E\u043B\u0438 \u0435\u043A\u0456\u043F\u0430\u0436 \u043C\u0430\u0454 \u0432\u0438\u043B\u0435\u0442\u0456\u0442\u0438 \u0456\u0437 \u0417\u0435\u043C\u043B\u0456.</p>

        <div><dt>\u0412\u0438\u0440\u043E\u0431\u043D\u0438\u0446\u0442\u0432\u043E</dt><dd>${fmt(p.kgPerDay, 1)}\xA0\u043A\u0433/\u0434\u043E\u0431\u0443</dd></div>
        <div><dt>\u0415\u043D\u0435\u0440\u0433\u0456\u0457 \u043F\u043E\u0442\u0440\u0456\u0431\u043D\u043E</dt><dd>${fmt(p.needW / 1e3, 1)}\xA0\u043A\u0412\u0442</dd></div>
        <div><dt>\u0415\u043D\u0435\u0440\u0433\u0456\u0457 \u0454</dt><dd>${fmt(p.haveW / 1e3, 1)}\xA0\u043A\u0412\u0442 <span class="muted small">(\u0441\u043E\u043D\u0446\u0435 ${fmt(p.solarW / 1e3, 1)}, \u0440\u0435\u0430\u043A\u0442\u043E\u0440\u0438 ${fmt(p.reactorW / 1e3)})</span></dd></div>

  function hint(p) {
    if (p.uptime < 1) return `\u0415\u043D\u0435\u0440\u0433\u0456\u0457 \u0432\u0438\u0441\u0442\u0430\u0447\u0430\u0454 \u043B\u0438\u0448\u0435 \u043D\u0430 ${pct(p.uptime)} \u0440\u043E\u0431\u043E\u0442\u0438 \u0437\u0430\u0432\u043E\u0434\u0443. \u0414\u043E\u0434\u0430\u0439\u0442\u0435 \u0441\u043E\u043D\u044F\u0447\u043D\u0438\u0445 \u043F\u0430\u043D\u0435\u043B\u0435\u0439 \u0430\u0431\u043E \u0440\u0435\u0430\u043A\u0442\u043E\u0440.`;
    if (!p.ok) return "\u0415\u043D\u0435\u0440\u0433\u0456\u0457 \u0434\u043E\u0441\u0438\u0442\u044C, \u0430\u043B\u0435 \u0431\u043B\u043E\u043A\u0456\u0432 \u0437\u0430\u043C\u0430\u043B\u043E. \u0411\u0456\u043B\u044C\u0448\u0435 \u0431\u043B\u043E\u043A\u0456\u0432 \u2014 \u0448\u0432\u0438\u0434\u0448\u0435, \u0430\u043B\u0435 \u043A\u043E\u0436\u0435\u043D \u043F\u043E\u0442\u0440\u0435\u0431\u0443\u0454 \u0449\u0435 300\xA0\u0412\u0442.";
    if (p.haveW > p.needW * 1.6) return "\u0412\u0441\u0442\u0438\u0433\u0430\u0454\u0442\u0435, \u0430\u043B\u0435 \u0435\u043D\u0435\u0440\u0433\u0456\u0457 \u043D\u0430\u0431\u0430\u0433\u0430\u0442\u043E \u0431\u0456\u043B\u044C\u0448\u0435, \u043D\u0456\u0436 \u0442\u0440\u0435\u0431\u0430. \u0417\u0430\u0439\u0432\u0456 \u043F\u0430\u043D\u0435\u043B\u0456 \u0439 \u0440\u0435\u0430\u043A\u0442\u043E\u0440\u0438 \u2014 \u0446\u0435 \u0437\u0430\u0439\u0432\u0456 \u0442\u043E\u043D\u043D\u0438, \u044F\u043A\u0456 \u0442\u0440\u0435\u0431\u0430 \u0434\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u0438 \u043D\u0430 \u041C\u0430\u0440\u0441.";
    return "\u0417\u0431\u0430\u043B\u0430\u043D\u0441\u043E\u0432\u0430\u043D\u0438\u0439 \u0437\u0430\u0432\u043E\u0434. \u0421\u043F\u0440\u043E\u0431\u0443\u0439\u0442\u0435 \u0437\u043C\u0435\u043D\u0448\u0438\u0442\u0438 \u043C\u0430\u0441\u0443: \u0449\u043E \u0432\u0438\u0433\u0456\u0434\u043D\u0456\u0448\u0435 \u2014 \u0440\u0435\u0430\u043A\u0442\u043E\u0440 \u0447\u0438 \u043F\u043E\u043B\u0435 \u043F\u0430\u043D\u0435\u043B\u0435\u0439?";
  }

  function balanceSvg(b, { ink: ink2 = "currentColor", muted = "#8a93a3", bar = "#3556a8", bad = "#c8352b", font = "IBM Plex Sans, Segoe UI, sans-serif" } = {}) {
    const W = 640;
    const H = 300;
    const left = { x: 40, y: 40, w: 300, h: 200 };
    const maxBin = Math.max(...b.bins, 1);
    const bw = left.w / b.bins.length;
    const hist = b.bins.map((v, i) => {
      const h = v / maxBin * left.h;
      return `<rect x="${left.x + i * bw + 2}" y="${left.y + left.h - h}" width="${bw - 4}" height="${h}" fill="${bar}" rx="2"/>`;
    }).join("");
    const ticks = [0, 50, 100].map((t2) => `<text x="${left.x + t2 / 100 * left.w}" y="${left.y + left.h + 16}" font-size="11" fill="${muted}" text-anchor="middle">${t2}</text>`).join("");
    const causes = b.causes.slice(0, 6);
    const maxC = Math.max(...causes.map((c) => c.share), 0.01);
    const rx = 380;
    const rw = 220;
    const rows = causes.map((c, i) => {
      const y = 52 + i * 32;
      const w = c.share / maxC * (rw - 40);
      const lost = c.key.startsWith("lost_");

    <h3>\u0417\u0432\u0456\u0434\u043A\u0438 \u0447\u0438\u0441\u043B\u0430</h3>
    <p>\u0423 \u0433\u0440\u0456 \u0442\u0440\u0438 \u0432\u0438\u0434\u0438 \u0447\u0438\u0441\u0435\u043B, \u0456 \u043C\u0438 \u0457\u0445 \u043D\u0435 \u0437\u043C\u0456\u0448\u0443\u0454\u043C\u043E:</p>
    <ul>
      <li><b>\u041F\u0435\u0440\u0435\u0432\u0456\u0440\u0435\u043D\u0456 \u0437 \u0434\u0436\u0435\u0440\u0435\u043B\u043E\u043C</b> (${[...d.targets, ...d.rockets, ...Object.values(C).flat(), ...d.missions].filter((x) => x.verified).length} \u043E\u0431\u2019\u0454\u043A\u0442\u0456\u0432): \u0432\u0456\u0434\u0441\u0442\u0430\u043D\u0456 \u0439 \u043F\u0435\u0440\u0456\u043E\u0434\u0438 \u043F\u043B\u0430\u043D\u0435\u0442 (NASA NSSDC), \u0432\u0430\u043D\u0442\u0430\u0436\u043E\u043F\u0456\u0434\u0439\u043E\u043C\u043D\u0456\u0441\u0442\u044C \u0456 \u0440\u043E\u0437\u043C\u0456\u0440\u0438 \u0440\u0430\u043A\u0435\u0442 (SpaceX, Wikipedia), \u043C\u0430\u0441\u0438 \u0430\u043F\u0430\u0440\u0430\u0442\u0456\u0432 \u0456 \u0440\u0435\u0430\u043B\u044C\u043D\u0438\u0445 \u043C\u0456\u0441\u0456\u0439, \u043C\u0430\u0441\u0430 \u0439 \u043F\u043E\u0442\u0443\u0436\u043D\u0456\u0441\u0442\u044C HiRISE, SEIS, SuperCam, Mastcam-Z, MOXIE, MMRTG, Kilopower. \u0423 \u0432\u0456\u043A\u043D\u0456 \xAB\u0414\u0435\u0442\u0430\u043B\u044C\u043D\u0456\u0448\u0435\xBB \u0442\u0430\u043A\u0456 \u0437\u043D\u0430\u0447\u0435\u043D\u043D\u044F \u043F\u043E\u0437\u043D\u0430\u0447\u0435\u043D\u0456 \u2713 \u0437 \u043F\u043E\u0441\u0438\u043B\u0430\u043D\u043D\u044F\u043C.</li>
      <li><b>\u0420\u0435\u0430\u043B\u044C\u043D\u0456 \u0437\u0430 \u043F\u043E\u0440\u044F\u0434\u043A\u043E\u043C \u0432\u0435\u043B\u0438\u0447\u0438\u043D\u0438, \u0430\u043B\u0435 \u0449\u0435 \u043D\u0435 \u0437\u0432\u0456\u0440\u0435\u043D\u0456:</b> \u0446\u0456\u043D\u0438 \u0440\u0430\u043A\u0435\u0442 \u0456 \u043F\u0440\u0438\u043B\u0430\u0434\u0456\u0432, \u043C\u0430\u0441\u0438 \u0440\u0435\u0448\u0442\u0438 \u043F\u0440\u0438\u043B\u0430\u0434\u0456\u0432, \u0448\u0432\u0438\u0434\u043A\u043E\u0441\u0442\u0456 \u0430\u043D\u0442\u0435\u043D, \u0434\u0430\u0442\u0438 \u0432\u0456\u043A\u043E\u043D \u0437\u0430\u043F\u0443\u0441\u043A\u0443. \u0412\u043E\u043D\u0438 \u043F\u043E\u0437\u043D\u0430\u0447\u0435\u043D\u0456 \u044F\u043A \u043E\u0440\u0456\u0454\u043D\u0442\u043E\u0432\u043D\u0456.</li>
      <li><b>\u0406\u0433\u0440\u043E\u0432\u0456 \u043F\u0430\u0440\u0430\u043C\u0435\u0442\u0440\u0438, \u044F\u043A\u0438\u0445 \u043D\u0435\u043C\u0430\u0454 \u0432 \u0440\u0435\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0456:</b> \u0431\u0430\u043B\u0438 \u043D\u0430\u0443\u043A\u0438 \u0456 \u0446\u0456\u043D\u043D\u0456\u0441\u0442\u044C \u043F\u0440\u0438\u043B\u0430\u0434\u0456\u0432 \u0434\u043B\u044F \u0437\u0430\u0432\u0434\u0430\u043D\u044C, \u0431\u044E\u0434\u0436\u0435\u0442\u0438 \u043A\u043B\u0430\u0441\u0456\u0432 \u043C\u0456\u0441\u0456\u0439, \u0439\u043C\u043E\u0432\u0456\u0440\u043D\u043E\u0441\u0442\u0456 \u043F\u043E\u0434\u0456\u0439 \u0456 \u0440\u0438\u0437\u0438\u043A\u0438 \u043F\u043E\u0441\u0430\u0434\u043A\u0438, \u043C\u043D\u043E\u0436\u043D\u0438\u043A \u0446\u0456\u043D\u043D\u043E\u0441\u0442\u0456 \u0404\u0432\u0440\u043E\u043F\u0438. \u0407\u0445 \u043F\u0456\u0434\u0456\u0431\u0440\u0430\u043D\u043E \u0442\u0430\u043A, \u0449\u043E\u0431 \u0431\u0430\u043B\u0430\u043D\u0441 \u0431\u0443\u0432 \u0447\u0435\u0441\u043D\u0438\u043C (\u0434\u0438\u0432. \u0433\u0440\u0430\u0444\u0456\u043A \u0432\u0438\u0449\u0435), \u0430 \u043D\u0435 \u0432\u0437\u044F\u0442\u043E \u0437 \u0434\u0436\u0435\u0440\u0435\u043B.</li>
    </ul>

    <h3>\u0413\u043E\u043B\u043E\u0432\u043D\u0456 \u0441\u043F\u0440\u043E\u0449\u0435\u043D\u043D\u044F</h3>
    <ul>
      <li>\u041E\u0440\u0431\u0456\u0442\u0438 \u043F\u043B\u0430\u043D\u0435\u0442 \u0432\u0432\u0430\u0436\u0430\u0454\u043C\u043E \u043A\u043E\u043B\u043E\u0432\u0438\u043C\u0438; \u0432\u0456\u0434\u0441\u0442\u0430\u043D\u044C \u0434\u043E \u0417\u0435\u043C\u043B\u0456 \u0456 \u0441\u043E\u043D\u044F\u0447\u043D\u0435 \u0437\u2019\u0454\u0434\u043D\u0430\u043D\u043D\u044F \u0440\u0430\u0445\u0443\u044E\u0442\u044C\u0441\u044F \u0437 \u0440\u0435\u0430\u043B\u044C\u043D\u0438\u0445 \u043F\u0435\u0440\u0456\u043E\u0434\u0456\u0432 \u043E\u0431\u0435\u0440\u0442\u0430\u043D\u043D\u044F.</li>
      <li>\u041F\u0430\u043B\u0438\u0432\u043E \u2014 \u0437\u0430 \u0440\u0456\u0432\u043D\u044F\u043D\u043D\u044F\u043C \u0426\u0456\u043E\u043B\u043A\u043E\u0432\u0441\u044C\u043A\u043E\u0433\u043E \u0437 \u043F\u0438\u0442\u043E\u043C\u0438\u043C \u0456\u043C\u043F\u0443\u043B\u044C\u0441\u043E\u043C 320\xA0\u0441. \u0421\u0438\u0441\u0442\u0435\u043C\u0430 \u043F\u043E\u0441\u0430\u0434\u043A\u0438 \u043D\u0430 \u041C\u0430\u0440\u0441 \u0432\u0430\u0436\u0438\u0442\u044C \u0443 2,3 \u0440\u0430\u0437\u0430 \u0431\u0456\u043B\u044C\u0448\u0435 \u0437\u0430 \u0430\u043F\u0430\u0440\u0430\u0442 (\u044F\u043A \u0443 Perseverance).</li>
      <li>\u0421\u043E\u043D\u044F\u0447\u043D\u0430 \u0435\u043D\u0435\u0440\u0433\u0456\u044F: 1361\xA0\u0412\u0442/\u043C\xB2 \u0431\u0456\u043B\u044F \u0417\u0435\u043C\u043B\u0456 \xD7 1/r\xB2 \xD7 \u043C\u043D\u043E\u0436\u043D\u0438\u043A \u0443\u043C\u043E\u0432 (\u043D\u0456\u0447, \u043A\u0443\u0442, \u0430\u0442\u043C\u043E\u0441\u0444\u0435\u0440\u0430).</li>
      <li>\u041D\u0430\u0434\u0456\u0439\u043D\u0456\u0441\u0442\u044C \u0440\u0430\u043A\u0435\u0442\u0438 \u2014 \u043F\u0440\u0430\u0432\u0438\u043B\u043E \u041B\u0430\u043F\u043B\u0430\u0441\u0430: (\u0443\u0441\u043F\u0456\u0445\u0438 + 1) / (\u043F\u043E\u043B\u044C\u043E\u0442\u0438 + 2).</li>
      <li>\u0420\u043E\u0437\u0440\u043E\u0431\u043A\u0430: \u0430\u043F\u0430\u0440\u0430\u0442 \u0432\u0430\u0436\u0447\u0430\u0454 \u043D\u0430 8\u201330% \u043F\u0440\u043E\u0442\u0438 \u043A\u0440\u0435\u0441\u043B\u0435\u043D\u044C (\u043F\u043E\u043D\u0430\u0434 \u0437\u0430\u043F\u0430\u0441 20% \u2014 \u043F\u0440\u043E\u0431\u043B\u0435\u043C\u0430), \u043F\u043E\u0434\u0456\u0457 \u0437\u0430\u0431\u0438\u0440\u0430\u044E\u0442\u044C \u0433\u0440\u043E\u0448\u0456 \u0437 \u0440\u0435\u0437\u0435\u0440\u0432\u0443 \u0456 \u0434\u043E\u0434\u0430\u044E\u0442\u044C \u043C\u0456\u0441\u044F\u0446\u0456 \u0437\u0430\u0442\u0440\u0438\u043C\u043A\u0438; \u043E\u0447\u0456\u043A\u0443\u0432\u0430\u043D\u043D\u044F \u043D\u0430\u0441\u0442\u0443\u043F\u043D\u043E\u0433\u043E \u0432\u0456\u043A\u043D\u0430 \u043A\u043E\u0448\u0442\u0443\u0454 ~6% \u0432\u0430\u0440\u0442\u043E\u0441\u0442\u0456 \u043F\u0440\u043E\u0454\u043A\u0442\u0443 \u043D\u0430 \u0440\u0456\u043A.</li>
      <li>\u041A\u043B\u0430\u0441 \u0440\u0438\u0437\u0438\u043A\u0443 A\u2013D \u043C\u043D\u043E\u0436\u0438\u0442\u044C \u0446\u0456\u043D\u0443, \u043C\u0430\u0441\u0443 \u0439 \u0447\u0430\u0441\u0442\u043E\u0442\u0443 \u0432\u0456\u0434\u043C\u043E\u0432; \u043C\u043D\u043E\u0436\u043D\u0438\u043A\u0438 \u0456\u0433\u0440\u043E\u0432\u0456, \u0441\u0430\u043C\u0430 \u043A\u043B\u0430\u0441\u0438\u0444\u0456\u043A\u0430\u0446\u0456\u044F \u2014 \u0441\u043F\u0440\u0430\u0432\u0436\u043D\u044F \u043F\u0440\u0430\u043A\u0442\u0438\u043A\u0430 NASA.</li>
      <li>\u0428\u0438\u0440\u043E\u0442\u0430 \u043C\u0430\u0439\u0434\u0430\u043D\u0447\u0438\u043A\u0430: \u0441\u043E\u043D\u044F\u0447\u043D\u0430 \u0435\u043D\u0435\u0440\u0433\u0456\u044F \u043C\u043D\u043E\u0436\u0438\u0442\u044C\u0441\u044F \u043D\u0430 \u043A\u043E\u0441\u0438\u043D\u0443\u0441 \u0448\u0438\u0440\u043E\u0442\u0438, \u043E\u0431\u0456\u0433\u0440\u0456\u0432 \u0440\u043E\u0441\u0442\u0435 \u0434\u043E +30%.</li>
            <li>\u041D\u0430\u0443\u043A\u0430 \u2014 \u0443\u043C\u043E\u0432\u043D\u0456 \u0431\u0430\u043B\u0438, \u0449\u043E \u0437\u0430\u043B\u0435\u0436\u0430\u0442\u044C \u0432\u0456\u0434 \u043F\u0440\u0438\u043B\u0430\u0434\u0443, \u0437\u0430\u0432\u0434\u0430\u043D\u043D\u044F, \u043C\u0430\u0439\u0434\u0430\u043D\u0447\u0438\u043A\u0430, \u0435\u043D\u0435\u0440\u0433\u0456\u0457 \u0456 \u043F\u0435\u0440\u0435\u0434\u0430\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445.</li>

      try {
        await step.run(this);

      } catch (err) {

    schedule() {

      const q = (s) => this.bar.querySelector(s);

      q(".demo-caption").textContent = this.busy ? "\u2026" : this.caption;
      q(".demo-progress").textContent = `${Math.max(1, this.i + 1)} / ${STEPS.length}`;
      const next = q('[data-demo="next"]');
      next.disabled = this.busy;
      next.textContent = step.last && !this.busy && !this.error ? "\u0413\u0440\u0430\u0442\u0438 \u0441\u0430\u043C\u043E\u043C\u0443" : "\u0414\u0430\u043B\u0456";
    }
    highlight(selector) {
      document.querySelectorAll(".demo-focus").forEach((el2) => el2.classList.remove("demo-focus"));

        target: "interstellar",
        cls: "flagship",
        goal: "atmosphere",
        rocket: "falcon_heavy",
        platform: "orbiter",
        instruments: ["magnetometer", "ir_spectrometer", "mass_spectrometer", "neutron"],
        power: "rtg_3",
        antenna: "hga_large",
        extras: ["radiation_vault"],
        riskClass: "A",
        reserve: 20
      };
      app.seed = "VOYAGER";
      applyMode(false);
      app.go("builder");
      toast("\u0417\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u043E \u0456\u0441\u0442\u043E\u0440\u0438\u0447\u043D\u0443 \u043C\u0456\u0441\u0456\u044E Voyager");
    };
    document.getElementById("voyager-btn")?.addEventListener("click", startVoyager);
    const hash = location.hash.slice(1);
    if (hash === "voyager") {
      startVoyager();
      return;
    }
    if (hash === "demo") {
      app.go("briefing", { focus: false });
      startDemo(app);
      return;
    }
    if (DEMO_BUILDS[hash]) {
      app.build = { ...emptyBuild(), ...DEMO_BUILDS[hash] };
      app.seed = DEMO_SEED;
      applyMode(false);
      app.go("builder", { focus: false });
      toast(`\u0414\u0435\u043C\u043E-\u043C\u0456\u0441\u0456\u044F ${app.seed}`);
      return;
    }
    const m = location.hash.match(/^#m=(.+)$/);
    if (m) {
      const decoded = decodeMission(m[1]);
      if (decoded) {
        app.build = { ...emptyBuild(), ...decoded.build };
        app.seed = decoded.seed || app.seed;
        applyMode(!!app.build.engineer);
        history.replaceState(null, "", location.pathname + location.search);
        app.go("builder", { focus: false });
        toast(`\u0417\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u043E \u043C\u0456\u0441\u0456\u044E ${app.seed}`);
        return;
      }
    }
    app.go("briefing", { focus: false });
  }
  start();
})();

</script>
</body>
</html>
