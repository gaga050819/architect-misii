<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Архітектор місії</title>
  <meta name="description" content="Гра про компроміси в дизайні космічних місій. NASA Space Apps 2026.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <style>
/* Архітектор місії — стилі.
   Ідея: «табло готовності місії». Тиха світла основа, а увага — на чотирьох шкалах
   ресурсів, кожна свого кольору, і на смузі маси, яка показує, куди йдуть кілограми. */

:root {
  color-scheme: light;
  --paper: #eef1f5;
  --surface: #ffffff;
  --sunken: #e3e8ef;
  --ink: #172238;
  --muted: #566176;
  --line: #cbd2dc;
  --focus: #3556a8;

  --budget: #2a7253;
  --mass: #3556a8;
  --power: #8d5d09;
  --data: #7b4ba6;
  --fuel: #8fa6d6;
  --edl: #c9d4ea;

  --good: #2a7253;
  --warn: #8d5d09;
  --bad: #be3229;
  --fact: #3556a8;

  --radius-s: 6px;
  --radius-m: 12px;
  --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #121a2b;
    --surface: #1a2438;
    --sunken: #0f1626;
    --ink: #e7ecf5;
    --muted: #9aa6bb;
    --line: #2f3b54;
    --focus: #8fa6ff;
    --budget: #4fb889;
    --mass: #7d9bf0;
    --power: #e7a93a;
    --data: #b48ae0;
    --fuel: #4d6290;
    --edl: #34446a;
    --good: #4fb889;
    --warn: #e7a93a;
    --bad: #f0675c;
    --fact: #8fa6ff;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --paper: #eef1f5;
  --surface: #ffffff;
  --sunken: #e3e8ef;
  --ink: #172238;
  --muted: #566176;
  --line: #cbd2dc;
  --focus: #3556a8;
  --budget: #2a7253;
  --mass: #3556a8;
  --power: #8d5d09;
  --data: #7b4ba6;
  --fuel: #8fa6d6;
  --edl: #c9d4ea;
  --good: #2a7253;
  --warn: #8d5d09;
  --bad: #be3229;
  --fact: #3556a8;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #121a2b; --surface: #1a2438; --sunken: #0f1626; --ink: #e7ecf5; --muted: #9aa6bb; --line: #2f3b54;
  --focus: #8fa6ff; --budget: #4fb889; --mass: #7d9bf0; --power: #e7a93a; --data: #b48ae0; --fuel: #4d6290; --edl: #34446a;
  --good: #4fb889; --warn: #e7a93a; --bad: #f0675c; --fact: #8fa6ff;
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.4rem); letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1rem; font-weight: 500; }
p { margin: 0 0 .75em; }
a { color: var(--focus); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- верхня панель ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; align-items: center; gap: 1rem 2rem; flex-wrap: wrap;
  padding: .75rem clamp(1rem, 3vw, 2rem);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface);
}
.brand { display: flex; align-items: center; gap: .6rem; font-family: var(--display); font-weight: 700; }
.brand-mark {
  width: 22px; height: 22px; border-radius: 50%;
  background: conic-gradient(var(--budget) 0 25%, var(--mass) 0 50%, var(--power) 0 75%, var(--data) 0);
}
.stages { display: flex; gap: .25rem; list-style: none; margin: 0; padding: 0; counter-reset: st; flex: 1; }
.stages li {
  counter-increment: st; font-size: .875rem; color: var(--muted); white-space: nowrap;
  padding: .25rem .6rem; border-radius: 999px;
}
.stages li::before { content: counter(st) ". "; }
.stages li.is-current { background: var(--ink); color: var(--surface); }
.stages li.is-done { color: var(--ink); }
.top-actions { display: flex; align-items: center; gap: 1rem; }
.mode-switch { display: flex; align-items: center; gap: .4rem; font-size: .875rem; cursor: pointer; }
.link-btn { background: none; border: 0; padding: .25rem; color: var(--focus); text-decoration: underline; cursor: pointer; font-size: .875rem; }
.icon-btn { background: none; border: 0; font-size: 1.5rem; line-height: 1; cursor: pointer; padding: .25rem .5rem; }
.theme-btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  background: var(--sunken);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: .25rem .6rem;
  border-radius: 999px;
  font-size: .85rem;
  font-weight: 500;
  cursor: pointer;
  line-height: 1.2;
}
.theme-btn:hover {
  border-color: var(--muted);
}
.theme-icon {
  display: inline-flex;
  align-items: center;
  line-height: 1;
}
.theme-icon svg { display: block; }

#screen { max-width: 1240px; margin: 0 auto; padding: clamp(1rem, 3vw, 2rem); outline: none; }

/* ---------- кнопки ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .7rem 1.2rem; border-radius: var(--radius-s);
  border: 1px solid var(--ink); background: var(--ink); color: var(--surface);
  font-weight: 600; cursor: pointer; text-decoration: none;
}
.btn:hover { filter: brightness(1.15); }
.btn[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
.btn.secondary { background: transparent; color: var(--ink); }
.btn.launch { background: var(--bad); border-color: var(--bad); color: #fff; font-family: var(--display); font-weight: 500; letter-spacing: .02em; }
.btn-row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1rem; }

/* ---------- картки вибору ---------- */
.choice-group { margin: 0 0 2rem; border: 0; padding: 0; }
.choice-group > legend { font-family: var(--display); font-weight: 500; font-size: 1.05rem; margin-bottom: .25rem; padding: 0; }
.choice-group > .group-hint { color: var(--muted); font-size: .9rem; margin-bottom: .75rem; }
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .6rem; }
.choice {
  position: relative; display: block; text-align: left;
  padding: .8rem .9rem; border-radius: var(--radius-s);
  background: var(--surface); border: 1px solid var(--line);
  cursor: pointer; width: 100%;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start;
}
.choice:hover { border-color: var(--muted); }
.choice[aria-pressed="true"], .choice[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.choice[aria-pressed="true"]::after, .choice[aria-checked="true"]::after {
  content: "✓"; position: absolute; top: .6rem; right: .7rem; font-weight: 700;
}
.choice[disabled] { opacity: .45; cursor: not-allowed; }
.choice-name { display: block; font-weight: 600; padding-right: 1.2rem; }
.choice-proto { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
.choice-desc { display: block; font-size: .875rem; color: var(--muted); }
.choice-stats { display: flex; flex-wrap: wrap; gap: .25rem .75rem; font-size: .8rem; margin-top: .4rem; font-variant-numeric: tabular-nums; }
.stat-mass { color: var(--mass); } .stat-power { color: var(--power); } .stat-cost { color: var(--budget); } .stat-data { color: var(--data); }
.choice-why { display: block; font-size: .8rem; color: var(--bad); margin-top: .3rem; }
.choice.big { padding: 1.1rem 1.2rem; }
.choice.big .choice-name { font-family: var(--display); font-weight: 500; font-size: 1.1rem; margin-bottom: .2rem; }

/* ---------- мініатюри і «Детальніше» ---------- */
.choice-wrap { position: relative; display: flex; }
.choice-wrap > .choice { flex: 1; }
.choice.has-thumb { padding-top: .6rem; }
.thumb { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; margin-bottom: .55rem; border-radius: 4px; overflow: hidden; background: var(--sunken); color: var(--ink); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.thumb-ill { position: absolute; inset: 0; display: grid; place-items: center; padding: 6px; }
.thumb-ill svg { max-width: 100%; max-height: 100%; width: auto; height: 100%; }
.thumb-rocket svg { height: 100%; }
.thumb-platform svg { width: 100%; height: auto; }
.thumb-instrument svg, .thumb-power svg, .thumb-antenna svg, .thumb-extra svg { height: 70%; }
.choice[aria-pressed="true"] .thumb { outline: 2px solid var(--ink); outline-offset: -2px; }
.zoom { position: absolute; top: .9rem; left: .9rem; z-index: 2; width: 30px; height: 30px; display: grid; place-items: center; padding: 0;
  border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; opacity: .92; }
.zoom svg { width: 16px; height: 16px; }
.zoom:hover { opacity: 1; border-color: var(--ink); }
.choice.big + .zoom { top: auto; bottom: .7rem; left: auto; right: .7rem; }
.viewer { width: min(860px, 94vw); }
#viewer-body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 1.2rem; padding: 1rem 1.2rem 1.4rem; }
.viewer-media { position: relative; margin: 0; }
.viewer-media img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: var(--radius-s); background: #000; display: block; position: relative; z-index: 1; }
.viewer-ill { display: grid; place-items: center; min-height: 260px; background: var(--sunken); border-radius: var(--radius-s); padding: 1rem; color: var(--ink); }
.viewer-ill.behind { display: none; }
.viewer-media.no-photo .viewer-ill.behind { display: grid; }
.viewer-ill svg { max-width: 100%; max-height: 50vh; width: auto; height: auto; }
.viewer-ill .glyph { width: 160px; height: 160px; }
.viewer-ill .rocket-big { height: 50vh; width: auto; }
.viewer-ill .craft { width: 100%; height: auto; }
.viewer-media figcaption { font-size: .8rem; color: var(--muted); margin-top: .4rem; }
.viewer-media .cap-ill { display: none; }
.viewer-media.no-photo .cap-ill, .viewer-media:not(:has(img)) .cap-ill { display: block; }
.viewer-media.no-photo .cap-photo { display: none; }
.viewer-info th { width: 42%; font-weight: 500; color: var(--muted); vertical-align: top; }
p.verified { margin-top: .7rem; color: var(--good); }
p.verified a { color: inherit; }
p.unverified { margin-top: .7rem; color: var(--warn); }
@media (max-width: 700px) { #viewer-body { grid-template-columns: 1fr; } }

/* ---------- брифінг ---------- */
.briefing-hero { max-width: 70ch; margin-bottom: 2rem; }
.briefing-hero p { font-size: 1.1rem; color: var(--muted); }

/* ---------- конструктор ---------- */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 2rem; align-items: start; }
.board {
  position: sticky; top: 5rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: 1.1rem 1.2rem;
}
.board h2 { font-size: 1rem; margin-bottom: .9rem; }
.gauge { margin-bottom: 1rem; }
.gauge-head { display: flex; justify-content: space-between; gap: .5rem; font-size: .875rem; }
.gauge-head b { font-weight: 600; }
.gauge-track { position: relative; height: 14px; border-radius: 7px; background: var(--sunken); overflow: hidden; margin-top: .3rem; }
.gauge-fill { position: absolute; inset: 0 auto 0 0; border-radius: 7px; transition: width .25s ease; }
.gauge-warnzone { position: absolute; top: 0; bottom: 0; left: 85%; width: 15%; background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--warn) 25%, transparent) 4px 7px); }
.gauge[data-status="fail"] .gauge-fill { background: var(--bad) !important; }
.gauge-note { font-size: .8rem; color: var(--muted); margin-top: .25rem; }
.gauge[data-status="fail"] .gauge-note { color: var(--bad); }
.gauge[data-status="warn"] .gauge-note { color: var(--warn); }

.massbar { margin: 1.2rem 0 1rem; }
.massbar-track { position: relative; display: flex; height: 26px; border-radius: var(--radius-s); background: var(--sunken); overflow: visible; }
.massbar-seg { height: 100%; min-width: 2px; }
.massbar-seg:first-child { border-radius: var(--radius-s) 0 0 var(--radius-s); }
.massbar-cap { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }
.massbar-legend { display: flex; flex-wrap: wrap; gap: .3rem .8rem; font-size: .78rem; margin-top: .5rem; color: var(--muted); }
.massbar-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: .3rem; vertical-align: -1px; }

.issues { list-style: none; padding: 0; margin: .5rem 0 1rem; font-size: .875rem; }
.issues li { padding: .35rem 0 .35rem 1.1rem; position: relative; }
.issues li::before { content: ""; position: absolute; left: 0; top: .75em; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
.issues li.warn::before { background: var(--warn); }
.board .btn.launch { width: 100%; padding: .9rem; font-size: 1.05rem; }

.eng-only { display: none; }
.mode-engineer .eng-only { display: block; }
.mode-engineer .cadet-only { display: none; }
.formula { font-size: .8rem; color: var(--muted); background: var(--sunken); border-radius: var(--radius-s); padding: .5rem .6rem; margin-top: .4rem; font-variant-numeric: tabular-nums; }

.filter-tabs { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .8rem; }
.filter-tab { background: var(--sunken); border: 1px solid var(--line); color: var(--muted); font-size: .8rem; padding: .25rem .65rem; border-radius: 999px; cursor: pointer; }
.filter-tab:hover { border-color: var(--muted); color: var(--ink); }
.filter-tab.is-active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.gauge-track { position: relative; }
.gauge-delta { position: absolute; top: 0; bottom: 0; pointer-events: none; border-radius: 2px; }
.gauge-delta.delta-add { background: repeating-linear-gradient(45deg, var(--ink) 0, var(--ink) 2px, transparent 2px, transparent 4px); opacity: .45; }
.gauge-delta.delta-sub { background: repeating-linear-gradient(45deg, var(--bad) 0, var(--bad) 2px, transparent 2px, transparent 4px); opacity: .45; }
@keyframes radioFlow { to { stroke-dashoffset: -14; } }
.radio-beam { animation: radioFlow 1.2s linear infinite; }
.sitemap-site { cursor: pointer; transition: transform .15s ease; }
.sitemap-site:hover circle:first-child, .sitemap-site.is-active circle:first-child { stroke: var(--ink); fill-opacity: .45; }
.sitemap-site:hover text, .sitemap-site.is-active text { font-weight: 700; }
.craft [data-part] { transition: opacity .15s ease, filter .15s ease; }
.craft.has-highlight [data-part] { opacity: .35; }
.craft.has-highlight [data-part].is-highlighted { opacity: 1; filter: drop-shadow(0 0 2px var(--ink)); }
.minibar { display: none; }

/* ---------- політ ---------- */
.flight { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 2rem; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
.panel h2 { font-size: 1rem; }
.track { display: flex; gap: 4px; margin: .5rem 0 1rem; }
.track span { flex: 1; height: 10px; border-radius: 3px; background: var(--sunken); }
.track span.done { background: var(--ink); }
.track span.lost { background: var(--bad); }
.track span.ext { outline: 1px dashed var(--muted); outline-offset: 1px; }
.tele { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem 1.2rem; }
.tele dt { font-size: .8rem; color: var(--muted); }
.tele dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.science-big { font-family: var(--display); font-size: 2.2rem; font-weight: 700; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
.chip { font-size: .8rem; padding: .15rem .55rem; border-radius: 999px; border: 1px solid var(--line); }
.chip.dead { color: var(--bad); border-color: var(--bad); text-decoration: line-through; }

.log { list-style: none; margin: 0; padding: 0; max-height: 70vh; overflow-y: auto; }
.log li { padding: .55rem 0 .55rem .9rem; border-left: 3px solid var(--line); margin-bottom: .2rem; font-size: .92rem; }
.log li.good { border-color: var(--good); }
.log li.bad { border-color: var(--bad); }
.log li.decision { border-color: var(--ink); font-weight: 600; }
.log li.fact { border-color: var(--fact); background: color-mix(in srgb, var(--fact) 8%, transparent); border-radius: 0 var(--radius-s) var(--radius-s) 0; padding-right: .7rem; }
.log .fact-label { display: block; font-size: .78rem; font-weight: 600; color: var(--fact); }
.log .step-tag { font-size: .75rem; color: var(--muted); margin-right: .4rem; font-variant-numeric: tabular-nums; }

.decision { border: 2px solid var(--ink); }
.decision h2 { font-size: 1.15rem; }
.options { display: grid; gap: .6rem; margin-top: .75rem; }
.sitemap { width: 100%; max-width: 420px; display: block; margin: .5rem auto 0; }
.sitemap circle.site { cursor: pointer; }

/* ---------- підсумок ---------- */
.summary-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem 2rem; align-items: end; margin-bottom: 1.5rem; }
.outcome { font-size: .95rem; font-weight: 600; }
.outcome.success { color: var(--good); } .outcome.partial, .outcome.weak { color: var(--warn); } .outcome.lost { color: var(--bad); }
.total { text-align: right; }
.total b { font-family: var(--display); font-size: 3rem; line-height: 1; display: block; }
.axes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.axis b { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.reasons { list-style: none; padding: 0; margin: 0; counter-reset: rs; }
.reasons li { counter-increment: rs; display: grid; grid-template-columns: 2.5rem 1fr; gap: .2rem .8rem; padding: .8rem 0; border-top: 1px solid var(--line); }
.reasons li::before { content: counter(rs); font-family: var(--display); font-size: 1.3rem; color: var(--bad); grid-row: span 2; }
.reasons .share { font-size: .8rem; color: var(--muted); }
.notes { list-style: none; padding: 0; margin: .5rem 0 0; }
.notes li { padding: .3rem 0 .3rem 1.1rem; position: relative; font-size: .92rem; }
.notes li::before { content: "+"; position: absolute; left: 0; color: var(--good); font-weight: 700; }
.notes li.bad::before { content: "!"; color: var(--bad); }
.compare { width: 100%; border-collapse: collapse; font-size: .9rem; }
.compare th, .compare td { text-align: left; padding: .45rem .5rem; border-bottom: 1px solid var(--line); }
.compare td { font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.photo { margin: 0; }
.photo img { width: 100%; border-radius: var(--radius-s); display: block; }
.photo .placeholder { aspect-ratio: 16 / 9; border-radius: var(--radius-s); background: var(--sunken); display: grid; place-items: center; text-align: center; padding: 1rem; color: var(--muted); font-size: .9rem; }
.photo figcaption { font-size: .8rem; color: var(--muted); margin-top: .35rem; }
.two-col { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 2rem; align-items: start; }

/* ---------- ілюстрації ---------- */
.choice-art { display: block; width: 100%; margin-bottom: .4rem; }
.planet { display: block; }
.board-patch { display: grid; grid-template-columns: auto 1fr; gap: .9rem; align-items: center; margin-bottom: 1rem; }
.board-patch h2 { margin-bottom: .2rem; }
.board-patch p { margin: 0; }
.patch { display: block; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .25)); }
.summary-patch { display: flex; align-items: center; gap: 1.2rem; }
.summary-patch .total .link-btn { display: block; margin-left: auto; margin-top: .3rem; }
.orbit-wrap { margin: 0 0 .5rem; }
.orbit { display: block; width: 100%; max-width: 300px; margin: 0 auto; }
.countdown { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgb(11 21 48 / .82); color: #f3efe4; }
.cd-num { font-family: var(--display); font-weight: 700; font-size: clamp(5rem, 20vw, 11rem); line-height: 1; animation: cd .65s ease-out both; }
.cd-go { font-family: var(--display); font-weight: 700; color: #ff8a6e; font-size: clamp(2.5rem, 9vw, 4.5rem); }
.liftoff { display: grid; justify-items: center; gap: 1rem; }
.rocket { width: auto; height: min(60vh, 420px); animation: rise 1.5s cubic-bezier(.55, 0, .9, .4) both; }
.flame { animation: flicker .08s infinite alternate; transform-box: fill-box; transform-origin: top center; }
@keyframes rise { 0% { transform: translateY(0); } 15% { transform: translateY(4px); } 100% { transform: translateY(-110vh); } }
@keyframes flicker { from { transform: scaleY(.85); } to { transform: scaleY(1.1); } }
.compare tr.is-new td { background: color-mix(in srgb, var(--budget) 12%, transparent); }
@keyframes cd { from { transform: scale(1.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.balance-chart svg { width: 100%; height: auto; display: block; margin: .5rem 0 1.5rem; }

.stack-wrap { display: grid; grid-template-columns: 84px 1fr; gap: .4rem; align-items: end; margin: 0 0 .6rem; background: var(--sunken); border-radius: var(--radius-s); padding: .5rem; }
.stack-rocket svg { display: block; width: 100%; height: auto; }
.stack-rocket figcaption { font-size: .75rem; text-align: center; color: var(--muted); line-height: 1.25; margin-top: .2rem; }
.fairing { display: block; width: 100%; height: auto; }
.craft-cap { font-size: .75rem; color: var(--muted); padding: .2rem .3rem 0; }
.craft-wrap { margin: 0 0 1rem; background: var(--sunken); border-radius: var(--radius-s); padding: .3rem; }
.craft { display: block; width: 100%; height: auto; }
.craft .is-new { animation: pop .45s ease-out both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }

.eng-tag { font-family: var(--body); font-size: .7rem; font-weight: 500; padding: .1rem .45rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); vertical-align: middle; margin-left: .3rem; }
.pp-note { font-size: .9rem; padding: .7rem .9rem; border-radius: var(--radius-s); background: color-mix(in srgb, var(--data) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--data) 35%, var(--line)); margin-bottom: 2rem; }
.seg-track { display: flex; }
.seg-track .seg { height: 100%; }
.gauge-track .tb-mark { top: -3px; bottom: -3px; }
.axis .gauge-track { overflow: visible; }
.axis .th-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; }

/* ---------- вікна запуску ---------- */
.windows { display: grid; grid-template-columns: repeat(48, minmax(0, 1fr)); gap: 2px; align-items: end; height: 92px; padding-bottom: 18px; position: relative; }
.win { position: relative; height: 100%; padding: 0; border: 0; background: var(--sunken); border-radius: 2px; cursor: pointer; display: flex; align-items: flex-end; }
.win-bar { display: block; width: 100%; background: var(--mass); border-radius: 2px; }
.win:hover .win-bar { filter: brightness(1.2); }
.win.is-sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.win.is-sel .win-bar { background: var(--ink); opacity: 1 !important; }
.win-year { position: absolute; top: calc(100% + 3px); left: 0; font-size: .7rem; color: var(--muted); white-space: nowrap; }
.win-info { margin-top: .6rem; }
@media (max-width: 560px) { .windows { height: 70px; gap: 1px; } }

/* ---------- колонія ---------- */
.colony-cta { margin-top: 1.2rem; padding: 1rem; border-radius: var(--radius-s); background: color-mix(in srgb, #c1572e 10%, var(--surface)); border: 1px solid color-mix(in srgb, #c1572e 40%, var(--line)); }
.colony-cta h3 { margin-bottom: .3rem; }
.slider { margin-bottom: .6rem; }
.slider input[type="range"] { width: 100%; accent-color: var(--ink); margin-top: .4rem; }
.timeline-bar { position: relative; height: 16px; border-radius: 8px; background: var(--sunken); margin-top: .6rem; }
.tb-fill { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: var(--good); transition: width .2s ease; }
.tb-fill.over { background: var(--bad); }
.tb-mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); }

/* ---------- демо-показ ---------- */
.demo-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem 2rem; align-items: center;
  padding: 1rem clamp(1rem, 3vw, 2rem) calc(1rem + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--surface);
  box-shadow: 0 -6px 24px rgb(0 0 0 / .25);
}
.demo-act { display: block; font-family: var(--display); font-weight: 500; font-size: .8rem; opacity: .75; margin-bottom: .25rem; }
.demo-caption { margin: 0; font-size: 1.08rem; line-height: 1.45; max-width: 78ch; min-height: 2.9em; }
.demo-ctl { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; justify-content: flex-end; }
.demo-progress { font-size: .85rem; opacity: .75; }
.demo-bar .mode-switch { color: inherit; }
.demo-bar .btn { background: var(--surface); color: var(--ink); border-color: var(--surface); min-width: 7.5rem; }
.demo-bar .btn.secondary { background: transparent; color: var(--surface); border-color: color-mix(in srgb, var(--surface) 50%, transparent); min-width: 0; }
.demo-bar :focus-visible { outline-color: var(--surface); }
body.demo-on #screen { padding-bottom: 12rem; }
body.demo-on .toast { bottom: calc(9.5rem + env(safe-area-inset-bottom, 0px)); }
.demo-focus { outline: 3px solid var(--power); outline-offset: 5px; border-radius: var(--radius-s); transition: outline-color .3s; }
@media (max-width: 760px) {
  .demo-bar { grid-template-columns: 1fr; gap: .6rem; padding-top: .7rem; }
  .demo-caption { font-size: .98rem; min-height: 0; }
  .demo-ctl { justify-content: space-between; flex-wrap: nowrap; gap: .6rem; }
  .demo-bar .btn, .demo-bar .btn.secondary { min-width: 0; padding: .55rem .9rem; }
  .demo-bar .mode-switch { font-size: .8rem; }
  body.demo-on #screen { padding-bottom: 16rem; }
  body.demo-on .toast { bottom: calc(14rem + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- про дані ---------- */
dialog { width: min(900px, 94vw); max-height: 86vh; border: 1px solid var(--line); border-radius: var(--radius-m); padding: 0; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgb(10 15 30 / .55); }
.dialog-head { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.2rem; background: var(--surface); border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; }
#about-body { padding: 1rem 1.2rem 1.5rem; }
#about-body table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-bottom: 1.5rem; }
#about-body th, #about-body td { text-align: left; padding: .35rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }

.toast { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: .6rem 1rem; border-radius: var(--radius-s); font-size: .9rem; z-index: 50; }
.noscript { padding: 2rem; }

/* ---------- адаптивність ---------- */
@media (max-width: 960px) {
  .builder, .flight, .two-col { grid-template-columns: 1fr; }
  .board { position: static; }
  .minibar {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; gap: .6rem; align-items: center;
    padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .minibar .mini { flex: 1; height: 8px; border-radius: 4px; background: var(--sunken); position: relative; overflow: hidden; }
  .minibar .mini i { position: absolute; inset: 0 auto 0 0; }
  .minibar .btn { padding: .5rem .8rem; }
  .builder { padding-bottom: 4.5rem; }
  .stages { order: 3; flex-basis: 100%; overflow-x: auto; }
  .topbar { position: static; gap: .5rem 1rem; }
}
@media (max-width: 560px) {
  .axes { grid-template-columns: 1fr; }
  .summary-head { grid-template-columns: 1fr; }
  .summary-patch { justify-content: flex-start; }
  .total { text-align: left; }
  .tele { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

,"simplified":"ігрова механіка; Li-ion ~120 Вт·год/кг"},{"id":"radiation_vault","effect":"radiation_vault","name":{"uk":"Радіаційний сейф","en":"Radiation vault"},"summary":{"uk":"Титанова камера для електроніки. Майже обов’язкова біля Юпітера.","en":"Titanium box for electronics."},"mass_kg":150,"cost_musd":40,"source":"https://science.nasa.gov/mission/juno/","simplified":"у Juno сейф важить ~200 кг; ігрова механіка"}],"propulsion":[{"id":"chem","name":{"uk":"Хімічні двигуни","en":"Chemical"},"prototype":"більшість апаратів","isp_s":320,"mass_kg":0,"cost_musd":0,"time_mult":1,"summary":{"uk":"Потужний короткий імпульс. Багато палива, зате швидко.","en":"High thrust, lots of propellant."},"source":"https://science.nasa.gov/learn/basics-of-space-flight/chapter11-4/","simplified":"питомий імпульс 320 с"},{"id":"ion","name":{"uk":"Іонний двигун","en":"Ion engine"},"prototype":"Dawn, Psyche","isp_s":3000,"mass_kg":60,"cost_musd":50,"time_mult":1.5,"min_p1au_w":7000,"platform_types":["orbiter"],"summary":{"uk":"У 10 разів економніший за паливом, але тяга як вага аркуша паперу: політ довший і потрібні великі сонячні панелі.","en":"10x more efficient, tiny thrust, needs big solar arrays."},"source":"https://science.nasa.gov/mission/dawn/","simplified":"питомий імпульс 3000 с; потребує панелей від 20 м²; ігрові маса й ціна"}],"orbits":[{"id":"standard","name":{"uk":"Стандартна орбіта","en":"Standard orbit"},"science_mult":1,"solar_mult":1,"dv_extra_kms":0,"summary":{"uk":"Безпечна висота з малою тінню.","en":"Safe altitude."}},{"id":"low","name":{"uk":"Низька орбіта","en":"Low orbit"},"science_mult":1.2,"solar_mult":0.85,"dv_extra_kms":0.15,"summary":{"uk":"Ближче до поверхні: детальніші знімки (+20% науки), але більше часу в тіні й більше палива на гальмування.","en":"Sharper data, more eclipse and fuel."}}],"dsn":[{"id":"less","name":{"uk":"2 години на добу","en":"2 h/day"},"hours_mult":0.5,"ops_musd_per_step":-2,"summary":{"uk":"Дешевше, але вдвічі менше даних.","en":"Cheaper, half the data."}},{"id":"std","name":{"uk":"4 години на добу","en":"4 h/day"},"hours_mult":1,"ops_musd_per_step":0,"summary":{"uk":"Типовий графік.","en":"Typical."}},{"id":"more","name":{"uk":"8 годин на добу","en":"8 h/day"},"hours_mult":2,"ops_musd_per_step":6,"summary":{"uk":"Удвічі більше даних, але час антен 70 м дорогий: їх ділять усі місії.","en":"Double the data, expensive."}}]},"events":{"random":[{"id":"antenna_stuck","phase":"cruise","prob":0.06,"effect":"antenna_fail","when":{"antenna":["hga_small","hga_large"]},"title":{"uk":"Антена не розкрилася","en":"Antenna failed to deploy"},"fact":{"uk":"У 1991 році головна антена зонда Galileo розкрилася лише частково. Місію врятували через малу антену, але даних стало в тисячі разів менше.","en":"In 1991 Galileo's high-gain antenna only partly opened."},"source":"https://science.nasa.gov/mission/galileo/"},{"id":"panel_deploy_fail","phase":"arrival","prob":0.04,"effect":"power_mult","value":0.4,"when":{"power_type":["solar"],"surface":true},"title":{"uk":"Панелі розкрилися не повністю","en":"Solar panels did not fully deploy"},"fact":{"uk":"Британський Beagle 2 сів на Марс у 2003 році, але не всі панелі розкрилися, і він не вийшов на зв’язок. Його знайшли на знімках HiRISE у 2015 році.","en":"Beagle 2 landed in 2003 but its panels did not fully open."},"source":"https://www.esa.int/Science_Exploration/Space_Science/Mars_Express/Beagle_2"},{"id":"dust_devil","phase":"ops","prob":0.1,"effect":"dust_clean","when":{"target":["mars"],"power_type":["solar"],"surface":true},"title":{"uk":"Пиловий вихор очистив панелі","en":"A dust devil cleaned the panels"},"fact":{"uk":"Вихори не раз очищали панелі Spirit і Opportunity, тому марсоходи пропрацювали в десятки разів довше, ніж планувалося.","en":"Dust devils repeatedly cleaned Spirit and Opportunity's panels."},"source":"https://science.nasa.gov/mission/mer-spirit/"},{"id":"wheel_stuck","phase":"ops","prob":0.04,"effect":"wheel_decision","once":true,"when":{"platform_type":["rover"]},"title":{"uk":"Заклинило колесо","en":"A wheel jammed"},"fact":{"uk":"З 2006 року Spirit їздив задом наперед, тягнучи зламане колесо. Curiosity теж пошкодив колеса об гострі камені, і NASA змінило маршрути й програму керування.","en":"Spirit drove backwards from 2006."},"source":"https://science.nasa.gov/mission/mer-spirit/","decision":true},{"id":"computer_reset","phase":"ops","prob":0.03,"effect":"lose_step","when":{},"title":{"uk":"Перезавантаження комп’ютера","en":"Computer reset"},"fact":{"uk":"Через кілька тижнів після посадки у 2004 році Spirit почав безперервно перезавантажуватися через переповнену флеш-пам’ять. Інженери лагодили його з Землі майже два тижні.","en":"Spirit's flash memory filled up in 2004, causing endless reboots."},"source":"https://science.nasa.gov/mission/mer-spirit/"},{"id":"discovery","phase":"ops","prob":0.04,"effect":"science_bonus","value":0.5,"when":{},"title":{"uk":"Несподівана знахідка","en":"Unexpected discovery"},"fact":{"uk":"Curiosity знайшов органічні молекули у породах кратера Ґейл віком 3 мільярди років (2018). Найцікавіші відкриття часто не плануються.","en":"Curiosity found organic molecules in 3-billion-year-old rocks."},"source":"https://science.nasa.gov/mission/msl-curiosity/"},{"id":"units_check","phase":"cruise","prob":0.06,"effect":"units_check","decision":true,"when":{},"title":{"uk":"Поправка курсу: перевірте одиниці","en":"Course correction: check the units"},"fact":{"uk":"Mars Climate Orbiter (1999) згорів в атмосфері Марса: програма виробника видавала імпульс двигунів у фунт-сила-секундах, а навігатори NASA вважали, що це ньютон-секунди.","en":"Mars Climate Orbiter was lost in 1999 due to a units mix-up."},"source":"https://science.nasa.gov/mission/mars-climate-orbiter/"},{"id":"tipped","phase":"arrival","prob":0.05,"effect":"tipped","when":{"platform_type":["lander"],"surface":true},"title":{"uk":"Апарат сів на бік","en":"The lander tipped over"},"fact":{"uk":"Американський Odysseus (2024) зачепив поверхню Місяця опорою і ліг на бік. Він працював, але частина приладів і антен дивилася не туди.","en":"Odysseus tipped over on the Moon in 2024."},"source":"https://science.nasa.gov/lunar-science/clps-deliveries/"},{"id":"empty_sample","phase":"ops","prob":0.08,"effect":"skip_instrument","value":"drill","once":true,"when":{"instrument":["drill"]},"title":{"uk":"Пробірка виявилася порожньою","en":"The sample tube came back empty"},"fact":{"uk":"Перша спроба Perseverance узяти зразок у серпні 2021 року дала порожню пробірку: порода розсипалася в пил. Наступні спроби вдалися.","en":"Perseverance's first core in 2021 was empty."},"source":"https://science.nasa.gov/mission/mars-2020-perseverance/"},{"id":"stuck_sand","phase":"ops","prob":0.02,"effect":"mobility","value":0.4,"once":true,"when":{"platform_type":["rover"]},"title":{"uk":"Ровер застряг у піску","en":"The rover got stuck in sand"},"fact":{"uk":"У 2009 році Spirit застряг у м’якому ґрунті. Інженери місяцями намагалися його витягти, а потім перетворили на нерухому станцію.","en":"Spirit got stuck in soft soil in 2009."},"source":"https://science.nasa.gov/mission/mer-spirit/"},{"id":"funding","phase":"ops","prob":0.03,"effect":"extra_steps","value":2,"once":true,"when":{},"title":{"uk":"Додаткове фінансування","en":"Extra funding"},"fact":{"uk":"NASA регулярно переглядає місії, що тривають, і продовжує фінансування найпродуктивніших. Так Curiosity, MRO і Mars Odyssey працюють уже понад десятиліття.","en":"NASA extends its most productive missions."},"source":"https://science.nasa.gov/mars/"}],"facts":{"launch_fail":{"uk":"Навіть надійні ракети іноді падають. У 2011 році «Фобос-Ґрунт» вийшов на орбіту Землі, але так і не полетів до Марса.","source":"https://nssdc.gsfc.nasa.gov/"},"capture_fail":{"uk":"Mars Climate Orbiter у 1999 році зійшов з курсу і згорів в атмосфері Марса: одна команда рахувала в фунт-секундах, інша — в ньютон-секундах.","source":"https://science.nasa.gov/mission/mars-climate-orbiter/"},"landing_fail":{"uk":"Schiaparelli (2016) і японський Hakuto-R на Місяці (2023) розбилися, бо програма неправильно визначила висоту над поверхнею.","source":"https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/Exploration/ExoMars/Schiaparelli"},"dust_storm":{"uk":"У 2018 році глобальна пилова буря закрила Сонце над Opportunity. Марсохід замовк і більше не прокинувся, пропрацювавши майже 15 років замість 90 діб.","source":"https://science.nasa.gov/mission/mer-opportunity/"},"conjunction":{"uk":"Раз на ~26 місяців Сонце на кілька тижнів стає між Землею і Марсом. NASA заздалегідь завантажує апаратам прості плани й не надсилає нових команд.","source":"https://science.nasa.gov/mars/"},"lunar_night":{"uk":"Місячна ніч триває ~14 земних діб, і температура падає нижче −170 °C. Японський SLIM кілька разів пережив ніч, а американський Odysseus (2024) — ні.","source":"https://science.nasa.gov/moon/"},"instrument_fail":{"uk":"Тепловий зонд HP3 («кріт») InSight так і не зміг заглибитися в марсіанський ґрунт: ґрунт виявився не таким, як очікували.","source":"https://science.nasa.gov/mission/insight/"},"platform_fail":{"uk":"Mars Observer (1993) замовк за три дні до виходу на орбіту Марса — імовірно, через витік у паливній системі.","source":"https://nssdc.gsfc.nasa.gov/"},"extended":{"uk":"Opportunity планували на 90 діб, а він пропрацював майже 15 років. Успішні місії NASA часто продовжує.","source":"https://science.nasa.gov/mission/mer-opportunity/"},"comms_lost":{"uk":"Без зв’язку апарат може працювати, але ми ніколи не дізнаємося, що він побачив.","source":"https://www.nasa.gov/communicating-with-missions/dsn/"},"sample":{"uk":"У жовтні 2020 року OSIRIS-REx торкнувся Бенну на кілька секунд. Ґрунт виявився пухким, як кульковий басейн, і голівка маніпулятора занурилася майже на пів метра. У вересні 2023 року капсула доставила на Землю ~120 г речовини.","source":"https://science.nasa.gov/mission/osiris-rex/"},"touch_fail":{"uk":"Японський зонд Хаябуса (2005) мав проблеми під час торкання астероїда Ітокава і привіз на Землю лише мікроскопічні пилинки. Але навіть їх вистачило для відкриттів.","source":"https://nssdc.gsfc.nasa.gov/"},"venus_heat":{"uk":"«Венера-13» (1982) пропрацювала на поверхні 127 хвилин і передала перші кольорові панорами Венери. Жоден апарат не жив там довше ~2 годин.","source":"https://nssdc.gsfc.nasa.gov/"},"venus_clouds":{"uk":"Magellan (1990–1994) склав карту 98% поверхні Венери радаром: хмари непрозорі для світла, але прозорі для радіохвиль.","source":"https://science.nasa.gov/mission/magellan/"},"radiation":{"uk":"Біля Юпітера радіація в тисячі разів сильніша за земну. Juno ховає електроніку в титановий сейф, а Europa Clipper лише пролітає повз Європу, щоб не залишатися в найгіршій зоні.","source":"https://science.nasa.gov/mission/juno/"}}},"missions":[{"id":"perseverance","name":"Perseverance","target":"mars","platform_type":"rover","year":2020,"rocket":"Atlas V 541","launch_mass_kg":4040,"craft_mass_kg":1025,"cost_musd":2800,"instruments":7,"power":"MMRTG","source":"https://science.nasa.gov/mission/mars-2020-perseverance/","verified":{"fields":["cost_musd","craft_mass_kg","launch_mass_kg"],"note":"перевірено 2026-11-09: маси збігаються з Wikipedia; NASA планує ~2,8 млрд $ на Mars 2020 за 10 років (Wikipedia)","urls":["https://en.wikipedia.org/wiki/Perseverance_(rover)","https://en.wikipedia.org/wiki/Mars_2020"]}},{"id":"curiosity","name":"Curiosity","target":"mars","platform_type":"rover","year":2011,"rocket":"Atlas V 541","launch_mass_kg":3900,"craft_mass_kg":899,"cost_musd":2500,"instruments":10,"power":"MMRTG","source":"https://science.nasa.gov/mission/msl-curiosity/","verified":{"fields":["craft_mass_kg","launch_mass_kg"],"note":"перевірено 2026-11-09: маси збігаються з Wikipedia","urls":["https://en.wikipedia.org/wiki/Curiosity_(rover)"]}},{"id":"opportunity","name":"Opportunity","target":"mars","platform_type":"rover","year":2003,"rocket":"Delta II","launch_mass_kg":1060,"craft_mass_     capture: (m) => m.s.navError ? "\u041F\u043E\u043C\u0438\u043B\u043A\u0430 \u0432 \u043E\u0434\u0438\u043D\u0438\u0446\u044F\u0445 \u043F\u0456\u0434 \u0447\u0430\u0441 \u043F\u043E\u043F\u0440\u0430\u0432\u043A\u0438 \u043A\u0443\u0440\u0441\u0443: \u0430\u043F\u0430\u0440\u0430\u0442 \u043F\u0456\u0434\u0456\u0439\u0448\u043E\u0432 \u0434\u043E \u0446\u0456\u043B\u0456 \u043D\u0435 \u0442\u0438\u043C \u043A\u0443\u0440\u0441\u043E\u043C \u0456 \u043D\u0435 \u0432\u0438\u0439\u0448\u043E\u0432 \u043D\u0430 \u043E\u0440\u0431\u0456\u0442\u0443. \u0421\u0430\u043C\u0435 \u0442\u0430\u043A \u0443 1999 \u0440\u043E\u0446\u0456 \u0437\u0430\u0433\u0438\u043D\u0443\u0432 Mars Climate Orbiter." : "\u0410\u043F\u0430\u0440\u0430\u0442 \u043D\u0435 \u0432\u0438\u0439\u0448\u043E\u0432 \u043D\u0430 \u043E\u0440\u0431\u0456\u0442\u0443 \u0446\u0456\u043B\u0456. \u0413\u0430\u043B\u044C\u043C\u0443\u0432\u0430\u043D\u043D\u044F \u0431\u0456\u043B\u044F \u043F\u043B\u0430\u043D\u0435\u0442\u0438 \u2014 \u043E\u0434\u0438\u043D \u0456\u0437 \u043D\u0430\u0439\u0440\u0438\u0437\u0438\u043A\u043E\u0432\u0430\u043D\u0456\u0448\u0438\u0445 \u043C\u043E\u043C\u0435\u043D\u0442\u0456\u0432 \u043C\u0456\u0441\u0456\u0457.",
    landing: (m) => `\u041F\u043E\u0441\u0430\u0434\u043A\u0430 \u0432 \u0440\u0430\u0439\u043E\u043D\u0456 \xAB${tr(m.s.site.name)}\xBB \u0437\u0430\u043A\u0456\u043D\u0447\u0438\u043B\u0430\u0441\u044F \u0430\u0432\u0430\u0440\u0456\u0454\u044E. \u0420\u0438\u0437\u0438\u043A \u0446\u044C\u043E\u0433\u043E \u043C\u0430\u0439\u0434\u0430\u043D\u0447\u0438\u043A\u0430 \u2014 ${pct2(m.s.site.risk * m.penalty)}%.`,
    storm: () => "\u041F\u0456\u0434 \u0447\u0430\u0441 \u043F\u0438\u043B\u043E\u0432\u043E\u0457 \u0431\u0443\u0440\u0456 \u0430\u043F\u0430\u0440\u0430\u0442 \u043F\u0440\u0430\u0446\u044E\u0432\u0430\u0432 \u0434\u0430\u043B\u0456, \u0430\u043A\u0443\u043C\u0443\u043B\u044F\u0442\u043E\u0440 \u0440\u043E\u0437\u0440\u044F\u0434\u0438\u0432\u0441\u044F, \u0456 \u0430\u043F\u0430\u0440\u0430\u0442 \u0437\u0430\u043C\u0435\u0440\u0437.",
    night: () => "\u0410\u043F\u0430\u0440\u0430\u0442 \u043D\u0435 \u043F\u0435\u0440\u0435\u0436\u0438\u0432 \u043C\u0456\u0441\u044F\u0447\u043D\u0443 \u043D\u0456\u0447: \u0441\u043E\u043D\u044F\u0447\u043D\u0456 \u043F\u0430\u043D\u0435\u043B\u0456 14\xA0\u0434\u0456\u0431 \u043D\u0435 \u0434\u0430\u044E\u0442\u044C \u0435\u043D\u0435\u0440\u0433\u0456\u0457, \u0430 \u0442\u0435\u043C\u043F\u0435\u0440\u0430\u0442\u0443\u0440\u0430 \u043F\u0430\u0434\u0430\u0454 \u043D\u0438\u0436\u0447\u0435 \u2212170 \xB0C.",
    power: () => "\u0415\u043D\u0435\u0440\u0433\u0456\u0457 \u043D\u0435 \u0432\u0438\u0441\u0442\u0430\u0447\u0430\u043B\u043E \u043D\u0430\u0432\u0456\u0442\u044C \u043D\u0430 \u043E\u0431\u0456\u0433\u0440\u0456\u0432 \u0456 \u043A\u043E\u043C\u043F\u2019\u044E\u0442\u0435\u0440, \u0456 \u0430\u043F\u0430\u0440\u0430\u0442 \u0432\u0438\u043C\u043A\u043D\u0443\u0432\u0441\u044F \u043D\u0430\u0437\u0430\u0432\u0436\u0434\u0438.",
    platform: () => "\u0412\u0456\u0434\u043C\u043E\u0432\u0438\u043B\u0430 \u0441\u0430\u043C\u0430 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0430 \u0430\u043F\u0430\u0440\u0430\u0442\u0430 (\u043A\u043E\u043C\u043F\u2019\u044E\u0442\u0435\u0440, \u0434\u0432\u0438\u0433\u0443\u043D \u0430\u0431\u043E \u043F\u0430\u043B\u0438\u0432\u043D\u0430 \u0441\u0438\u0441\u0442\u0435\u043C\u0430).",
    comms: () => "\u0417\u0432\u2019\u044F\u0437\u043E\u043A \u0432\u0442\u0440\u0430\u0447\u0435\u043D\u043E \u043E\u0441\u0442\u0430\u0442\u043E\u0447\u043D\u043E: \u0440\u0435\u0437\u0435\u0440\u0432\u043D\u043E\u0457 \u0430\u043D\u0442\u0435\u043D\u0438 \u043D\u0435 \u0431\u0443\u043B\u043E.",
    touch: () => "\u041F\u0456\u0434 \u0447\u0430\u0441 \u0442\u043E\u0440\u043A\u0430\u043D\u043D\u044F \u0430\u0441\u0442\u0435\u0440\u043E\u0457\u0434\u0430 \u0437\u043E\u043D\u0434 \u0437\u0430\u0447\u0435\u043F\u0438\u0432 \u0431\u0440\u0438\u043B\u0443 \u0456 \u043F\u043E\u0448\u043A\u043E\u0434\u0438\u0432\u0441\u044F. \u0411\u0456\u043B\u044F \u0442\u0456\u043B\u0430 \u0437 \u043C\u0430\u0439\u0436\u0435 \u043D\u0443\u043B\u044C\u043E\u0432\u043E\u044E \u0433\u0440\u0430\u0432\u0456\u0442\u0430\u0446\u0456\u0454\u044E \u043A\u043E\u0436\u0435\u043D \u0434\u043E\u0442\u0438\u043A \u2014 \u0440\u0438\u0437\u0438\u043A."
  };
  function reasons(m) {
    const s = m.s;
    const r = m.r;
    const st = stats(m);
    const ideal = Math.max(1, s.ideal);
    const list = [];
    const texts = {
      failure: () => {
        const dead = s.instruments.filter((i) => !i.alive).map((i) => tr(i.def.name));
        return `\u0412\u0456\u0434\u043C\u043E\u0432\u0438\u043B\u0438 \u043F\u0440\u0438\u043B\u0430\u0434\u0438: ${dead.join(", ")}. \u041A\u043E\u0436\u0435\u043D \u043F\u0440\u0438\u043B\u0430\u0434 \u043C\u0430\u0454 \u0440\u0435\u0430\u043B\u044C\u043D\u0443 \u043D\u0430\u0434\u0456\u0439\u043D\u0456\u0441\u0442\u044C; \u0440\u0435\u0437\u0435\u0440\u0432\u0443 \u0430\u0431\u043E \u0437\u0430\u043F\u0430\u0441\u0443 \u043D\u0435 \u0431\u0443\u043B\u043E.`;
      },
      power: () => {
        if (r.power.type === "solar") {
          const sun = pct2(sunShare(r.target));
          let t2 = `\u0415\u043D\u0435\u0440\u0433\u0456\u0457 \u0432\u0438\u0441\u0442\u0430\u0447\u0430\u043B\u043E \u043B\u0438\u0448\u0435 \u043D\u0430 ${pct2(st.avgU)}% \u0440\u043E\u0431\u043E\u0442\u0438 \u043F\u0440\u0438\u043B\u0430\u0434\u0456\u0432. \u0411\u0456\u043B\u044F \u0446\u0456\u043B\u0456 \xAB${tr(r.target.name)}\xBB \u0421\u043E\u043D\u0446\u0435 \u0434\u0430\u0454 ${sun}% \u0437\u0435\u043C\u043D\u043E\u0433\u043E \u0441\u0432\u0456\u0442\u043B\u0430`;
          if (isSurface(r) && r.target.dust_per_step > 0) t2 += `, \u0430 \u043F\u0438\u043B \u043D\u0430 \u043F\u0430\u043D\u0435\u043B\u044F\u0445 \u0437\u043D\u0438\u0437\u0438\u0432 \u0432\u0438\u0440\u043E\u0431\u043B\u0435\u043D\u043D\u044F \u0434\u043E ${pct2(st.minDust)}%`;
          if (isSurface(r) && s.site && s.siteSolar < 0.95) t2 += `. \u041C\u0430\u0439\u0434\u0430\u043D\u0447\u0438\u043A \u043D\u0430 \u0448\u0438\u0440\u043E\u0442\u0456 ${fmt2(Math.abs(s.site.lat))}\xB0 \u043E\u0442\u0440\u0438\u043C\u0443\u0454 \u043B\u0438\u0448\u0435 ${pct2(s.siteSolar)}% \u0441\u043E\u043D\u0446\u044F \u043F\u043E\u0440\u0456\u0432\u043D\u044F\u043D\u043E \u0437 \u0435\u043A\u0432\u0430\u0442\u043E\u0440\u043E\u043C`;
          return t2 + ".";
        }
        return `\u0420\u0406\u0422\u0415\u0413 \u0434\u0430\u0432\u0430\u0432 \u0443 \u0441\u0435\u0440\u0435\u0434\u043D\u044C\u043E\u043C\u0443 ${fmt2(st.avgProduced)}\xA0\u0412\u0442, \u0430 \u043F\u043B\u0430\u0442\u0444\u043E\u0440\u043C\u0456 \u0439 \u043F\u0440\u0438\u043B\u0430\u0434\u0430\u043C \u043F\u043E\u0442\u0440\u0456\u0431\u043D\u043E ${fmt2(busPower(r) + instrumentPower(r.instruments))}\xA0\u0412\u0442. \u041F\u0440\u0438\u043B\u0430\u0434\u0438 \u043F\u0440\u0430\u0446\u044E\u0432\u0430\u043B\u0438 ${pct2(st.avgU)}% \u0447\u0430\u0441\u0443.`;
      },
      storm: () => "\u041F\u0438\u043B\u043E\u0432\u0430 \u0431\u0443\u0440\u044F \u0437\u0430\u043A\u0440\u0438\u0432\u0430\u043B\u0430 \u0421\u043E\u043D\u0446\u0435 \u0456 \u043A\u0430\u043C\u0435\u0440\u0438: \u043F\u0430\u043D\u0435\u043B\u0456 \u0434\u0430\u0432\u0430\u043B\u0438 40% \u043F\u043E\u0442\u0443\u0436\u043D\u043E\u0441\u0442\u0456, \u0430 \u0437\u043D\u0456\u043C\u043A\u0438 \u0432\u0438\u0445\u043E\u0434\u0438\u043B\u0438 \u043C\u0443\u0442\u043D\u0438\u043C\u0438.",
      sleep: () => `\u0410\u043F\u0430\u0440\u0430\u0442 \u043F\u0435\u0440\u0435\u0447\u0456\u043A\u0443\u0432\u0430\u0432 \u0431\u0443\u0440\u044E \u0432 \u0441\u043F\u043B\u044F\u0447\u043E\u043C\u0443 \u0440\u0435\u0436\u0438\u043C\u0456 (${s.lossCount.sleep} \u043A\u0440\u043E\u043A.): \u0431\u0435\u0437\u043F\u0435\u0447\u043D\u043E, \u0430\u043B\u0435 \u0431\u0435\u0437 \u043D\u0430\u0443\u043A\u0438.`,
      downlink: () => {
        if (s.antenna.relay) return `\u0420\u0435\u0442\u0440\u0430\u043D\u0441\u043B\u044F\u0442\u043E\u0440 \u043F\u0435\u0440\u0435\u0434\u0430\u0454 ~${fmt2(s.antenna.relay_mbit_per_day)}\xA0\u041C\u0431\u0456\u0442 \u043D\u0430 \u0434\u043E\u0431\u0443, \u0430 \u043F\u0440\u0438\u043B\u0430\u0434\u0438 \u0437\u0431\u0438\u0440\u0430\u043B\u0438 \u0431\u0456\u043B\u044C\u0448\u0435. \u041F\u0435\u0440\u0435\u0434\u0430\u043D\u043E \u043B\u0438\u0448\u0435 ${pct2(st.sent / Math.max(1, st.collected))}% \u0434\u0430\u043D\u0438\u0445.`;
        return `\u0410\u043D\u0442\u0435\u043D\u0430 \xAB${tr(s.antenna.name)}\xBB \u043F\u0435\u0440\u0435\u0434\u0430\u043B\u0430 \u043B\u0438\u0448\u0435 ${pct2(st.sent / Math.max(1, st.collected))}% \u0437\u0456\u0431\u0440\u0430\u043D\u0438\u0445 \u0434\u0430\u043D\u0438\u0445. \u041D\u0430\u0439\u0431\u0456\u043B\u044C\u0448\u0430 \u0432\u0456\u0434\u0441\u0442\u0430\u043D\u044C \u0434\u043E \u0417\u0435\u043C\u043B\u0456 \u2014 ${fmt2(st.maxDist, 2)}\xA0\u0430.\u043E., \u0456 \u0442\u0430\u043C \u0441\u0438\u0433\u043D\u0430\u043B \u0441\u043B\u0430\u0431\u0448\u0438\u0439 \u0443 ${fmt2(st.maxDist ** 2, 1)} \u0440\u0430\u0437\u0430, \u043D\u0456\u0436 \u043D\u0430 \u0432\u0456\u0434\u0441\u0442\u0430\u043D\u0456 1\xA0\u0430.\u043E.`;
      },
      conjunction: () => s.conjunctionPlan === "idle" ? "\u041F\u0456\u0434 \u0447\u0430\u0441 \u0441\u043E\u043D\u044F\u0447\u043D\u043E\u0433\u043E \u0437\u2019\u0454\u0434\u043D\u0430\u043D\u043D\u044F \u0430\u043F\u0430\u0440\u0430\u0442 \u043F\u0440\u043E\u0441\u0442\u043E\u044E\u0432\u0430\u0432 \u0431\u0435\u0437 \u043A\u043E\u043C\u0430\u043D\u0434." : "\u0421\u043E\u043D\u044F\u0447\u043D\u0435 \u0437\u2019\u0454\u0434\u043D\u0430\u043D\u043D\u044F \u043D\u0430 ~2 \u0442\u0438\u0436\u043D\u0456 \u043F\u0435\u0440\u0435\u0440\u0432\u0430\u043B\u043E \u0437\u0432\u2019\u044F\u0437\u043E\u043A. \u041F\u043B\u0430\u043D, \u0437\u0430\u0432\u0430\u043D\u0442\u0430\u0436\u0435\u043D\u0438\u0439 \u0437\u0430\u0437\u0434\u0430\u043B\u0435\u0433\u0456\u0434\u044C, \u0437\u043C\u0435\u043D\u0448\u0438\u0432 \u0432\u0442\u0440\u0430\u0442\u0438.",
      clouds: () => "\u0425\u043C\u0430\u0440\u0438 \u0412\u0435\u043D\u0435\u0440\u0438 \u043D\u0435\u043F\u0440\u043E\u0437\u043E\u0440\u0456 \u0434\u043B\u044F \u0441\u0432\u0456\u0442\u043B\u0430: \u043E\u043F\u0442\u0438\u0447\u043D\u0456 \u043F\u0440\u0438\u043B\u0430\u0434\u0438 \u0431\u0430\u0447\u0438\u043B\u0438 \u043B\u0438\u0448\u0435 \u0432\u0435\u0440\u0445\u0456\u0432\u043A\u0438 \u0445\u043C\u0430\u0440. \u0420\u0430\u0434\u0430\u0440 \u0431\u0430\u0447\u0438\u0442\u044C \u043A\u0440\u0456\u0437\u044C \u0445\u043C\u0430\u0440\u0438, \u0442\u043E\u043C\u0443 Magellan \u0441\u043A\u043B\u0430\u0432 \u043A\u0430\u0440\u0442\u0443 \u0441\u0430\u043C\u0435 \u043D\u0438\u043C.",
      mobility: () => "\u0417\u0430\u043A\u043B\u0438\u043D\u0438\u043B\u043E \u043A\u043E\u043B\u0435\u0441\u043E: \u0440\u043E\u0432\u0435\u0440 \u0457\u0437\u0434\u0438\u0432 \u043F\u043E\u0432\u0456\u043B\u044C\u043D\u0456\u0448\u0435 \u0456 \u0434\u043E\u0441\u043B\u0456\u0434\u0436\u0443\u0432\u0430\u0432 \u043C\u0435\u043D\u0448\u0435 \u043C\u0456\u0441\u0446\u044C.",
